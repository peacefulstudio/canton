        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: userId
          description: |-
            The user from whom to revoke rights.

            Required
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UserManagementService.RevokeUserRightsBody'
      tags:
        - UserManagementService
  /v2/version:
    get:
      summary: Read the Ledger API version
      operationId: VersionService_GetLedgerApiVersion
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetLedgerApiVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - VersionService
definitions:
  com.daml.ledger.api.v2.ActiveContract:
    type: object
    properties:
      createdEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          The event as it appeared in the context of its last update (i.e. daml transaction or
          reassignment). In particular, the last offset, node_id pair is preserved.
          The last update is the most recent update created or assigned this contract on synchronizer_id synchronizer.
          The offset of the CreatedEvent might point to an already pruned update, therefore it cannot necessarily be used
          for lookups.

          Required
      synchronizerId:
        type: string
        description: Required
        title: A valid synchronizer id
      reassignmentCounter:
        type: string
        format: uint64
        description: |-
          Each corresponding assigned and unassigned event has the same reassignment_counter. This strictly increases
          with each unassign command for the same contract. Creation of the contract corresponds to reassignment_counter
          equals zero.
          This field will be the reassignment_counter of the latest observable activation event on this synchronizer, which is
          before the active_at_offset.

          Required
  com.daml.ledger.api.v2.Archived:
    type: object
    properties:
      archivedEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.ArchivedEvent'
        title: Required
      synchronizerId:
        type: string
        description: Required
        title: The synchronizer which sequenced the archival of the contract
  com.daml.ledger.api.v2.ArchivedEvent:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: Required
        title: |-
          The offset of origin.
          Offsets are managed by the participant nodes.
          Transactions can thus NOT be assumed to have the same offsets on different participant nodes.
          It is a valid absolute offset (positive integer)
      nodeId:
        type: integer
        format: int32
        description: Required
        title: |-
          The position of this event in the originating transaction or reassignment.
          Node IDs are not necessarily equal across participants,
          as these may see different projections/parts of transactions.
          Must be valid node ID (non-negative integer)
      contractId:
        type: string
        description: |-
          The ID of the archived contract.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          Identifies the template that defines the choice that archived the contract.
          This template's package-id may differ from the target contract's package-id
          if the target contract has been upgraded or downgraded.

          The identifier uses the package-id reference format.

          Required
      witnessParties:
        type: array
        items:
          type: string
        description: |-
          The parties that are notified of this event. For an ``ArchivedEvent``,
          these are the intersection of the stakeholders of the contract in
          question and the parties specified in the ``TransactionFilter``. The
          stakeholders are the union of the signatories and the observers of
          the contract.
          Each one of its elements must be a valid PartyIdString (as described
          in ``value.proto``).

          Required: must be non-empty
      packageName:
        type: string
        description: |-
          The package name of the contract.

          Required
      implementedInterfaces:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The interfaces implemented by the target template that have been
          matched from the interface filter query.
          Populated only in case interface filters with include_interface_view set.

          If defined, the identifier uses the package-id reference format.

          Optional: can be empty
    description: Records that a contract has been archived, and choices may no longer be exercised on it.
  com.daml.ledger.api.v2.AssignCommand:
    type: object
    properties:
      reassignmentId:
        type: string
        description: |-
          The ID from the unassigned event to be completed by this assignment.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      source:
        type: string
        description: Required
        title: |-
          The ID of the source synchronizer
          Must be a valid synchronizer id
      target:
        type: string
        description: Required
        title: |-
          The ID of the target synchronizer
          Must be a valid synchronizer id
    title: Assign a contract
  com.daml.ledger.api.v2.AssignedEvent:
    type: object
    properties:
      source:
        type: string
        description: |-
          The ID of the source synchronizer.
          Must be a valid synchronizer id.

          Required
      target:
        type: string
        description: |-
          The ID of the target synchronizer.
          Must be a valid synchronizer id.

          Required
      reassignmentId:
        type: string
        description: |-
          The ID from the unassigned event.
          For correlation capabilities.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      submitter:
        type: string
        description: |-
          Party on whose behalf the assign command was executed.
          Empty if the assignment happened offline via the repair service.
          Must be a valid PartyIdString (as described in ``value.proto``).

          Optional
      reassignmentCounter:
        type: string
        format: uint64
        description: |-
          Each corresponding assigned and unassigned event has the same reassignment_counter. This strictly increases
          with each unassign command for the same contract. Creation of the contract corresponds to reassignment_counter
          equals zero.

          Required
      createdEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          The offset of this event refers to the offset of the assignment,
          while the node_id is the index of within the batch.

          Required
    description: Records that a contract has been assigned, and it can be used on the target synchronizer.
  com.daml.ledger.api.v2.Command:
    type: object
    properties:
      create:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreateCommand'
      exercise:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExerciseCommand'
      exerciseByKey:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExerciseByKeyCommand'
      createAndExercise:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreateAndExerciseCommand'
    description: A command can either create a new contract or exercise a choice on an existing contract.
  com.daml.ledger.api.v2.Commands:
    type: object
    properties:
      workflowId:
        type: string
        description: |-
          Identifier of the on-ledger workflow that this command is a part of.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      userId:
        type: string
        description: |-
          Uniquely identifies the participant user that issued the command.
          Must be a valid UserIdString (as described in ``value.proto``).
          Required unless authentication is used with a user token.
          In that case, the token's user-id will be used for the request's user_id.

          Optional
      commandId:
        type: string
        description: |-
          Uniquely identifies the command.
          The triple (user_id, act_as, command_id) constitutes the change ID for the intended ledger change,
          where act_as is interpreted as a set of party names.
          The change ID can be used for matching the intended ledger changes with all their completions.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      commands:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.Command'
        description: |-
          Individual elements of this atomic command. Must be non-empty.

          Required: must be non-empty
      deduplicationDuration:
        type: string
        description: |-
          Specifies the length of the deduplication period.
          It is interpreted relative to the local clock at some point during the submission's processing.
          Must be non-negative. Must not exceed the maximum deduplication time.
      deduplicationOffset:
        type: string
        format: int64
        description: |-
          Specifies the start of the deduplication period by a completion stream offset (exclusive).
          Must be a valid absolute offset (positive integer) or participant begin (zero).
      minLedgerTimeAbs:
        type: string
        format: date-time
        description: |-
          Lower bound for the ledger time assigned to the resulting transaction.
          Note: The ledger time of a transaction is assigned as part of command interpretation.
          Use this property if you expect that command interpretation will take a considerate amount of time, such that by
          the time the resulting transaction is sequenced, its assigned ledger time is not valid anymore.
          Must not be set at the same time as min_ledger_time_rel.

          Optional
      minLedgerTimeRel:
        type: string
        description: |-
          Same as min_ledger_time_abs, but specified as a duration, starting from the time the command is received by the server.
          Must not be set at the same time as min_ledger_time_abs.

          Optional
      actAs:
        type: array
        items:
          type: string
        description: |-
          Set of parties on whose behalf the command should be executed.
          If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
          to act on behalf of each of the given parties.
          Each element must be a valid PartyIdString (as described in ``value.proto``).

          Required: must be non-empty
      readAs:
        type: array
        items:
          type: string
        description: |-
          Set of parties on whose behalf (in addition to all parties listed in ``act_as``) contracts can be retrieved.
          This affects Daml operations such as ``fetch``, ``fetchByKey``, ``lookupByKey``, ``exercise``, and ``exerciseByKey``.
          Note: A participant node of a Daml network can host multiple parties. Each contract present on the participant
          node is only visible to a subset of these parties. A command can only use contracts that are visible to at least
          one of the parties in ``act_as`` or ``read_as``. This visibility check is independent from the Daml authorization
          rules for fetch operations.
          If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
          to read contract data on behalf of each of the given parties.

          Optional: can be empty
      submissionId:
        type: string
        description: |-
          A unique identifier to distinguish completions for different submissions with the same change ID.
          Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
          with the same change ID.
          Must be a valid LedgerString (as described in ``value.proto``).

          If omitted, the participant or the committer may set a value of their choice.

          Optional
      disclosedContracts:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.DisclosedContract'
        description: |-
          Additional contracts used to resolve contract & contract key lookups.

          Optional: can be empty
      synchronizerId:
        type: string
        description: Optional
        title: Must be a valid synchronizer id
      packageIdSelectionPreference:
        type: array
        items:
          type: string
        description: 'Optional: can be empty'
        title: |-
          The package-id selection preference of the client for resolving
          package names and interface instances in command submission and interpretation
      prefetchContractKeys:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.PrefetchContractKey'
        description: |-
          Fetches the contract keys into the caches to speed up the command processing.
          Should only contain contract keys that are expected to be resolved during interpretation of the commands.
          Keys of disclosed contracts do not need prefetching.

          Optional: can be empty
      tapsMaxPasses:
        type: integer
        format: int64
        description: |-
          The maximum number of passes for the Topology-Aware Package Selection (TAPS).
          Higher values can increase the chance of successful package selection for routing of interpreted transactions.
          If unset, this defaults to the value defined in the participant configuration.
          The provided value must not exceed the limit specified in the participant configuration.

          Optional
    description: A composite command that groups multiple commands together.
  com.daml.ledger.api.v2.Completion:
    type: object
    properties:
      commandId:
        type: string
        description: |-
          The ID of the succeeded or failed command.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      status:
        $ref: '#/definitions/google.rpc.Status'
        description: |-
          Identifies the exact type of the error.
          It uses the same format of conveying error details as it is used for the RPC responses of the APIs.

          Optional
      updateId:
        type: string
        description: |-
          The update_id of the transaction or reassignment that resulted from the command with command_id.

          Only set for successfully executed commands.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      userId:
        type: string
        description: |-
          The user-id that was used for the submission, as described in ``commands.proto``.
          Must be a valid UserIdString (as described in ``value.proto``).

          Required
      actAs:
        type: array
        items:
          type: string
        description: |-
          The set of parties on whose behalf the commands were executed.
          Contains the ``act_as`` parties from ``commands.proto``
          filtered to the requesting parties in CompletionStreamRequest.
          The order of the parties need not be the same as in the submission.
          Each element must be a valid PartyIdString (as described in ``value.proto``).

          Required: must be non-empty
      submissionId:
        type: string
        description: |-
          The submission ID this completion refers to, as described in ``commands.proto``.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      deduplicationOffset:
        type: string
        format: int64
        description: |-
          Specifies the start of the deduplication period by a completion stream offset (exclusive).

          Must be a valid absolute offset (positive integer) or participant begin (zero).
      deduplicationDuration:
        type: string
        description: |-
          Specifies the length of the deduplication period.
          It is measured in record time of completions.

          Must be non-negative.
      traceContext:
        $ref: '#/definitions/com.daml.ledger.api.v2.TraceContext'
        description: |-
          The trace context transported in this message corresponds to the trace context supplied
          by the client application in a HTTP2 header of the original command submission.
          We typically use a header to transfer this type of information. Here we use message
          body, because it is used in gRPC streams which do not support per message headers.
          This field will be populated with the trace context contained in the original submission.
          If that was not provided, a unique ledger-api-server generated trace context will be used
          instead.

          Optional
        title: The Ledger API trace context
      offset:
        type: string
        format: int64
        description: |-
          May be used in a subsequent CompletionStreamRequest to resume the consumption of this stream at a later time.
          Must be a valid absolute offset (positive integer).

          Required
      synchronizerTime:
        $ref: '#/definitions/com.daml.ledger.api.v2.SynchronizerTime'
        description: |-
          - successful/failed transactions: identifies the synchronizer of the transaction
          - for successful/failed unassign commands: identifies the source synchronizer
          - for successful/failed assign commands: identifies the target synchronizer

          Required
        title: |-
          The synchronizer along with its record time.
          The synchronizer id provided, in case of
      paidTrafficCost:
        type: string
        format: int64
        description: |-
          The traffic cost paid by this participant node for the confirmation request
          for the submitted command.

          Commands whose execution is rejected before their corresponding
          confirmation request is ordered by the synchronizer will report a paid
          traffic cost of zero.
          If a confirmation request is ordered for a command, but the request fails
          (e.g., due to contention with a concurrent contract archival), the traffic
          cost is paid and reported on the failed completion for the request.

          If you want to correlate the traffic cost of a successful completion
          with the transaction that resulted from the command, you can use the
          ``offset`` field to retrieve the transaction using
          ``UpdateService.GetUpdateByOffset`` on the same participant node; or alternatively use the ``update_id``
          field to retrieve the transaction using ``UpdateService.GetUpdateById`` on any participant node
          that sees the transaction.

          Note: for completions processed before the participant started serving
          traffic cost on the Ledger API, this field will be set to zero.
          Additionally, the total cost incurred by the submitting node for the submission of the transaction may be greater
          than the reported cost, for example if retries were issued due to failed submissions to the synchronizer.
          The cost reported here is the one paid for ordering the confirmation request.

          Optional
    description: 'A completion represents the status of a submitted command on the ledger: it can be successful or failed.'
  com.daml.ledger.api.v2.CompletionStreamRequest:
    type: object
    properties:
      userId:
        type: string
        description: |-
          Only completions of commands submitted with the same user_id will be visible in the stream.
          Must be a valid UserIdString (as described in ``value.proto``).

          Required unless authentication is used with a user token.
          In that case, the token's user-id will be used for the request's user_id.

          Optional
      parties:
        type: array
        items:
          type: string
        description: |-
          Non-empty list of parties whose data should be included.
          The stream shows only completions of commands for which at least one of the ``act_as`` parties is in the given set of parties.
          Must be a valid PartyIdString (as described in ``value.proto``).

          Required: must be non-empty
      beginExclusive:
        type: string
        format: int64
        description: |-
          This optional field indicates the minimum offset for completions. This can be used to resume an earlier completion stream.
          If not set the ledger uses the ledger begin offset instead.
          If specified, it must be a valid absolute offset (positive integer) or zero (ledger begin offset).
          If the ledger has been pruned, this parameter must be specified and greater than the pruning offset.

          Optional
  com.daml.ledger.api.v2.CompletionStreamResponse:
    type: object
    properties:
      completion:
        $ref: '#/definitions/com.daml.ledger.api.v2.Completion'
      offsetCheckpoint:
        $ref: '#/definitions/com.daml.ledger.api.v2.OffsetCheckpoint'
  com.daml.ledger.api.v2.CreateAndExerciseCommand:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of the contract the client wants to create.
          Both package-name and package-id reference identifier formats for the template-id are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      createArguments:
        $ref: '#/definitions/com.daml.ledger.api.v2.Record'
        description: |-
          The arguments required for creating a contract from this template.

          Required
      choice:
        type: string
        description: |-
          The name of the choice the client wants to exercise.
          Must be a valid NameString (as described in ``value.proto``).

          Required
      choiceArgument:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The argument for this choice.

          Required
    description: Create a contract and exercise a choice on it in the same transaction.
  com.daml.ledger.api.v2.CreateCommand:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of contract the client wants to create.
          Both package-name and package-id reference identifier formats for the template-id are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      createArguments:
        $ref: '#/definitions/com.daml.ledger.api.v2.Record'
        description: |-
          The arguments required for creating a contract from this template.

          Required
    description: Create a new contract instance based on a template.
  com.daml.ledger.api.v2.Created:
    type: object
    properties:
      createdEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          The event as it appeared in the context of its original update (i.e. daml transaction or
          reassignment) on this participant node. You can use its offset and node_id to find the
          corresponding update and the node within it.

          Required
      synchronizerId:
        type: string
        description: Required
        title: The synchronizer which sequenced the creation of the contract
  com.daml.ledger.api.v2.CreatedEvent:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: Required
        title: |-
          The offset of origin, which has contextual meaning, please see description at messages that include a CreatedEvent.
          Offsets are managed by the participant nodes.
          Transactions can thus NOT be assumed to have the same offsets on different participant nodes.
          It is a valid absolute offset (positive integer)
      nodeId:
        type: integer
        format: int32
        description: Required
        title: |-
          The position of this event in the originating transaction or reassignment.
          The origin has contextual meaning, please see description at messages that include a CreatedEvent.
          Node IDs are not necessarily equal across participants,
          as these may see different projections/parts of transactions.
          Must be valid node ID (non-negative integer)
      contractId:
        type: string
        description: |-
          The ID of the created contract.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of the created contract.
          The identifier uses the package-id reference format.

          Required
      contractKey:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The key of the created contract.
          This will be set if and only if ``template_id`` defines a contract key.

          Optional
      contractKeyHash:
        type: string
        format: byte
        description: |-
          The hash of contract_key.
          This will be set if and only if ``template_id`` defines a contract key.

          Optional: can be empty
      createArguments:
        $ref: '#/definitions/com.daml.ledger.api.v2.Record'
        description: |-
          The arguments that have been used to create the contract.

          Required
      createdEventBlob:
        type: string
        format: byte
        description: |-
          Opaque representation of contract create event payload intended for forwarding
          to an API server as a contract disclosed as part of a command
          submission.

          Optional: can be empty
      interfaceViews:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.InterfaceView'
        description: |-
          - its party in the ``witness_parties`` of this event,
          - and which is implemented by the template of this event,
          - and which has ``include_interface_view`` set.

          Optional: can be empty
        title: |-
          Interface views specified in the transaction filter.
          Includes an ``InterfaceView`` for each interface for which there is a ``InterfaceFilter`` with
      witnessParties:
        type: array
        items:
          type: string
        description: |-
          The parties that are notified of this event. When a ``CreatedEvent``
          is returned as part of a transaction tree or ledger-effects transaction, this will include all
          the parties specified in the ``TransactionFilter`` that are witnesses  of the event
          (the stakeholders of the contract and all informees of all the ancestors
          of this create action that this participant knows about).
          If served as part of a ACS delta transaction those will
          be limited to all parties specified in the ``TransactionFilter`` that
          are stakeholders of the contract (i.e. either signatories or observers).
          If the ``CreatedEvent`` is returned as part of an AssignedEvent,
          ActiveContract or IncompleteUnassigned (so the event is related to
          an assignment or unassignment): this will include all parties of the
          ``TransactionFilter`` that are stakeholders of the contract.

          The behavior of reading create events visible to parties not hosted
          on the participant node serving the Ledger API is undefined. Concretely,
          there is neither a guarantee that the participant node will serve all their
          create events on the ACS stream, nor is there a guarantee that matching archive
          events are delivered for such create events.

          For most clients this is not a problem, as they only read events for parties
          that are hosted on the participant node. If you need to read events
          for parties that may not be hosted at all times on the participant node,
          subscribe to the ``TopologyEvent``s for that party by setting a corresponding
          ``UpdateFormat``.  Using these events, query the ACS as-of an offset where the
          party is hosted on the participant node, and ignore create events at offsets
          where the party is not hosted on the participant node.

          Required: must be non-empty
      signatories:
        type: array
        items:
          type: string
        description: |-
          The signatories for this contract as specified by the template.

          Required: must be non-empty
      observers:
        type: array
        items:
          type: string
        description: |-
          The observers for this contract as specified explicitly by the template or implicitly as choice controllers.
          This field never contains parties that are signatories.

          Optional: can be empty
      createdAt:
        type: string
        format: date-time
        description: |-
          Ledger effective time of the transaction that created the contract.

          Required
      packageName:
        type: string
        description: |-
          The package name of the created contract.

          Required
      acsDelta:
        type: boolean
        description: |-
          Whether this event would be part of respective ACS_DELTA shaped stream,
          and should therefore considered when tracking contract activeness on the client-side.

          Required
      representativePackageId:
        type: string
        description: |-
          A package-id present in the participant package store that typechecks the contract's argument.
          This may differ from the package-id of the template used to create the contract.
          For contracts created before Canton 3.4, this field matches the contract's creation package-id.

          NOTE: Experimental, server internal concept, not for client consumption. Subject to change without notice.

          Required
    description: Records that a contract has been created, and choices may now be exercised on it.
  com.daml.ledger.api.v2.CryptoKeyFormat:
    type: string
    enum:
      - CRYPTO_KEY_FORMAT_UNSPECIFIED
      - CRYPTO_KEY_FORMAT_DER
      - CRYPTO_KEY_FORMAT_RAW
      - CRYPTO_KEY_FORMAT_DER_X509_SUBJECT_PUBLIC_KEY_INFO
    default: CRYPTO_KEY_FORMAT_UNSPECIFIED
    description: |-
      - CRYPTO_KEY_FORMAT_DER: ASN.1 + DER encoding
      Legacy format no longer used, except for migrations
       - CRYPTO_KEY_FORMAT_RAW: Raw encoding of a key
       - CRYPTO_KEY_FORMAT_DER_X509_SUBJECT_PUBLIC_KEY_INFO: ASN.1 + DER-encoding of X.509 SubjectPublicKeyInfo structure: https://datatracker.ietf.org/doc/html/rfc5280#section-4.1
    title: Serialization format for crypto keys and signatures
  com.daml.ledger.api.v2.CumulativeFilter:
    type: object
    properties:
      wildcardFilter:
        $ref: '#/definitions/com.daml.ledger.api.v2.WildcardFilter'
        description: Optional
        title: A wildcard filter that matches all templates
      interfaceFilter:
        $ref: '#/definitions/com.daml.ledger.api.v2.InterfaceFilter'
        description: |-
          Include an ``InterfaceView`` for every ``InterfaceFilter`` matching a contract.
          The ``InterfaceFilter`` instances MUST each use a unique ``interface_id``.

          Optional
      templateFilter:
        $ref: '#/definitions/com.daml.ledger.api.v2.TemplateFilter'
        description: |-
          A template for which the data will be included in the
          ``create_arguments`` of a matching ``CreatedEvent``.
          If a contract is simultaneously selected by a template filter and one or more interface filters,
          the corresponding ``include_created_event_blob`` are consolidated using an OR operation.

          Optional
    description: |-
      A filter that matches all contracts that are either an instance of one of
      the ``template_filters`` or that match one of the ``interface_filters``.
  com.daml.ledger.api.v2.DisclosedContract:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template id of the contract.
          The identifier uses the package-id reference format.

          If provided, used to validate the template id of the contract serialized in the created_event_blob.

          Optional
      contractId:
        type: string
        description: |-
          If provided, used to validate the contract id of the contract serialized in the created_event_blob.

          Optional
        title: The contract id
      createdEventBlob:
        type: string
        format: byte
        description: |-
          Opaque byte string containing the complete payload required by the Daml engine
          to reconstruct a contract not known to the receiving participant.

          Required: must be non-empty
      synchronizerId:
        type: string
        description: Optional
        title: The ID of the synchronizer where the contract is currently assigned
    description: |-
      An additional contract that is used to resolve
      contract & contract key lookups.
  com.daml.ledger.api.v2.Enum:
    type: object
    properties:
      enumId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          Omitted from the transaction stream when verbose streaming is not enabled.
          Optional when submitting commands.
      constructor:
        type: string
        title: |-
          Determines which of the Variant's alternatives is encoded in this message.
          Must be a valid NameString.
          Required
    description: A value with finite set of alternative representations.
  com.daml.ledger.api.v2.Event:
    type: object
    properties:
      created:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          The event as it appeared in the context of its original daml transaction on this participant node.
          In particular, the offset, node_id pair of the daml transaction are preserved.
      archived:
        $ref: '#/definitions/com.daml.ledger.api.v2.ArchivedEvent'
      exercised:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExercisedEvent'
    description: |-
      - ACS delta: events can be CreatedEvent or ArchivedEvent
      - ledger effects: events can be CreatedEvent or ExercisedEvent

      In the update service the events are restricted to the events
      visible for the parties specified in the transaction filter. Each
      event message type below contains a ``witness_parties`` field which
      indicates the subset of the requested parties that can see the event
      in question.
    title: 'Events in transactions can have two primary shapes:'
  com.daml.ledger.api.v2.EventFormat:
    type: object
    properties:
      filtersByParty:
        type: object
        additionalProperties:
          $ref: '#/definitions/com.daml.ledger.api.v2.Filters'
        description: |-
          1. For **ledger-effects** create and exercise events are returned, for which the witnesses include at least one of
             the listed parties and match the per-party filter.
          2. For **transaction and active-contract-set streams** create and archive events are returned for all contracts whose
             stakeholders include at least one of the listed parties and match the per-party filter.

          Optional: can be empty
        title: |-
          Each key must be a valid PartyIdString (as described in ``value.proto``).
          The interpretation of the filter depends on the transaction-shape being filtered:
      filtersForAnyParty:
        $ref: '#/definitions/com.daml.ledger.api.v2.Filters'
        description: |-
          Wildcard filters that apply to all the parties existing on the participant. The interpretation of the filters is the same
          with the per-party filter as described above.

          Optional
      verbose:
        type: boolean
        description: |-
          If enabled, values served over the API will contain more information than strictly necessary to interpret the data.
          In particular, setting the verbose flag to true triggers the ledger to include labels for record fields.

          Optional
    description: |-
      A format for events which defines both which events should be included
      and what data should be computed and included for them.

      Note that some of the filtering behavior depends on the `TransactionShape`,
      which is expected to be specified alongside usages of `EventFormat`.
  com.daml.ledger.api.v2.ExerciseByKeyCommand:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of contract the client wants to exercise.
          Both package-name and package-id reference identifier formats for the template-id are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      contractKey:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The key of the contract the client wants to exercise upon.

          Required
      choice:
        type: string
        description: Required
        title: |-
          The name of the choice the client wants to exercise.
          Must be a valid NameString (as described in ``value.proto``)
      choiceArgument:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The argument for this choice.

          Required
    description: Exercise a choice on an existing contract specified by its key.
  com.daml.ledger.api.v2.ExerciseCommand:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template or interface of the contract the client wants to exercise.
          Both package-name and package-id reference identifier formats for the template-id are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.
          To exercise a choice on an interface, specify the interface identifier in the template_id field.

          Required
      contractId:
        type: string
        description: |-
          The ID of the contract the client wants to exercise upon.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      choice:
        type: string
        description: Required
        title: |-
          The name of the choice the client wants to exercise.
          Must be a valid NameString (as described in ``value.proto``)
      choiceArgument:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The argument for this choice.

          Required
    description: Exercise a choice on an existing contract.
  com.daml.ledger.api.v2.ExercisedEvent:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: Required
        title: |-
          The offset of origin.
          Offsets are managed by the participant nodes.
          Transactions can thus NOT be assumed to have the same offsets on different participant nodes.
          It is a valid absolute offset (positive integer)
      nodeId:
        type: integer
        format: int32
        description: Required
        title: |-
          The position of this event in the originating transaction or reassignment.
          Node IDs are not necessarily equal across participants,
          as these may see different projections/parts of transactions.
          Must be valid node ID (non-negative integer)
      contractId:
        type: string
        description: |-
          The ID of the target contract.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          Identifies the template that defines the executed choice.
          This template's package-id may differ from the target contract's package-id
          if the target contract has been upgraded or downgraded.

          The identifier uses the package-id reference format.

          Required
      interfaceId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The interface where the choice is defined, if inherited.
          If defined, the identifier uses the package-id reference format.

          Optional
      choice:
        type: string
        description: |-
          The choice that was exercised on the target contract.
          Must be a valid NameString (as described in ``value.proto``).

          Required
      choiceArgument:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The argument of the exercised choice.

          Required
      actingParties:
        type: array
        items:
          type: string
        description: |-
          The parties that exercised the choice.
          Each element must be a valid PartyIdString (as described in ``value.proto``).

          Required: must be non-empty
      consuming:
        type: boolean
        description: |-
          If true, the target contract may no longer be exercised.

          Required
      witnessParties:
        type: array
        items:
          type: string
        description: |-
          The parties that are notified of this event. The witnesses of an exercise
          node will depend on whether the exercise was consuming or not.
          If consuming, the witnesses are the union of the stakeholders,
          the actors and all informees of all the ancestors of this event this
          participant knows about.
          If not consuming, the witnesses are the union of the signatories,
          the actors and all informees of all the ancestors of this event this
          participant knows about.
          In both cases the witnesses are limited to the querying parties, or not
          limited in case anyParty filters are used.
          Note that the actors might not necessarily be observers
          and thus stakeholders. This is the case when the controllers of a
          choice are specified using "flexible controllers", using the
          ``choice ... controller`` syntax, and said controllers are not
          explicitly marked as observers.
          Each element must be a valid PartyIdString (as described in ``value.proto``).

          Required: must be non-empty
      lastDescendantNodeId:
        type: integer
        format: int32
        description: |-
          Specifies the upper boundary of the node ids of the events in the same transaction that appeared as a result of
          this ``ExercisedEvent``. This allows unambiguous identification of all the members of the subtree rooted at this
          node. A full subtree can be constructed when all descendant nodes are present in the stream. If nodes are heavily
          filtered, it is only possible to determine if a node is in a consequent subtree or not.

          Required
      exerciseResult:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The result of exercising the choice.

          Optional
      packageName:
        type: string
        description: |-
          The package name of the contract.

          Required
      implementedInterfaces:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          If the event is consuming, the interfaces implemented by the target template that have been
          matched from the interface filter query.
          Populated only in case interface filters with include_interface_view set.

          The identifier uses the package-id reference format.

          Optional: can be empty
      acsDelta:
        type: boolean
        description: |-
          Whether this event would be part of respective ACS_DELTA shaped stream,
          and should therefore considered when tracking contract activeness on the client-side.

          Required
    description: Records that a choice has been exercised on a target contract.
  com.daml.ledger.api.v2.ExperimentalCommandInspectionService:
    type: object
    properties:
      supported:
        type: boolean
        title: Required
    title: Whether the Ledger API supports command inspection service
  com.daml.ledger.api.v2.ExperimentalFeatures:
    type: object
    properties:
      staticTime:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExperimentalStaticTime'
        title: Optional
      commandInspectionService:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExperimentalCommandInspectionService'
        title: Optional
    description: See the feature message definitions for descriptions.
  com.daml.ledger.api.v2.ExperimentalStaticTime:
    type: object
    properties:
      supported:
        type: boolean
        title: Required
    description: Ledger is in the static time mode and exposes a time service.
  com.daml.ledger.api.v2.FeaturesDescriptor:
    type: object
    properties:
      experimental:
        $ref: '#/definitions/com.daml.ledger.api.v2.ExperimentalFeatures'
        description: |-
          Features under development or features that are used
          for ledger implementation testing purposes only.

          Daml applications SHOULD not depend on these in production.

          Required
      userManagement:
        $ref: '#/definitions/com.daml.ledger.api.v2.UserManagementFeature'
        description: |-
          If set, then the Ledger API server supports user management.
          It is recommended that clients query this field to gracefully adjust their behavior for
          ledgers that do not support user management.

          Required
      partyManagement:
        $ref: '#/definitions/com.daml.ledger.api.v2.PartyManagementFeature'
        description: |-
          If set, then the Ledger API server supports party management configurability.
          It is recommended that clients query this field to gracefully adjust their behavior to
          maximum party page size.

          Required
      offsetCheckpoint:
        $ref: '#/definitions/com.daml.ledger.api.v2.OffsetCheckpointFeature'
        description: Required
        title: It contains the timeouts related to the periodic offset checkpoint emission
      packageFeature:
        $ref: '#/definitions/com.daml.ledger.api.v2.PackageFeature'
        description: |-
          If set, then the Ledger API server supports package listing
          configurability. It is recommended that clients query this field to
          gracefully adjust their behavior to maximum package listing page size.

          Required
  com.daml.ledger.api.v2.Filters:
    type: object
    properties:
      cumulative:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.CumulativeFilter'
        description: |-
          Every filter in the cumulative list expands the scope of the resulting stream. Each interface,
          template or wildcard filter means additional events that will match the query.
          The impact of include_interface_view and include_created_event_blob fields in the filters will
          also be accumulated.
          A template or an interface SHOULD NOT appear twice in the accumulative field.
          A wildcard filter SHOULD NOT be defined more than once in the accumulative field.
          If no ``CumulativeFilter`` defined, the default of a single ``WildcardFilter`` with
          include_created_event_blob unset is used.

          Optional: can be empty
    description: The union of a set of template filters, interface filters, or a wildcard.
  com.daml.ledger.api.v2.GenMap:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.GenMap.Entry'
  com.daml.ledger.api.v2.GenMap.Entry:
    type: object
    properties:
      key:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
  com.daml.ledger.api.v2.GetActiveContractsPageRequest:
    type: object
    properties:
      activeAtOffset:
        type: string
        format: int64
        description: |-
          The offset at which the snapshot of the active contracts will be computed.
          Must be no greater than the current ledger end offset.
          Must be greater than or equal to the last pruning offset.
          Optional, if defined, it must be a valid absolute offset (positive integer) or ledger begin offset (zero).
          If zero, the empty set will be returned.
          If not defined, the current ledger end will be used and it will be populated in the response.

          Optional
      eventFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        description: |-
          Format of the contract_entries in the result. In case of CreatedEvent the presentation will be of
          TRANSACTION_SHAPE_ACS_DELTA.

          Required
      maxPageSize:
        type: integer
        format: int32
        description: |-
          The result page will contain at most max_page_size entries of the respective active contract snapshot.
          The server might reject max_page_size breaching the server-specified limit.
          Optional, if not defined, the default will be determined by the server.

          Optional
      pageToken:
        type: string
        format: byte
        description: |-
          - are executed on the same participant,
          - use the same active_at_offset and event_format,
          - and the participant's store was not pruned to after the active_at_offset.

          If not specified, the first page of the active contracts snapshot will be returned.

          Optional: can be empty
        title: |-
          To get the next page of the active contracts snapshot, the ``page_token`` should be set to the
          ``next_page_token`` of the last ``GetActiveContractsPageResponse``.
          The page token only works if subsequent requests:
  com.daml.ledger.api.v2.GetActiveContractsPageResponse:
    type: object
    properties:
      activeContracts:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.GetActiveContractsResponse'
        description: |-
          The collection of active contracts for this page response.

          Required: must be non-empty
      activeAtOffset:
        type: string
        format: int64
        description: |-
          The active_at_offset which was specified in the request, or the calculated active_at_offset from the actual
          ledger end from at the evaluation of the request.

          Required
      nextPageToken:
        type: string
        format: byte
        description: |-
          If not present this is the last page. If present, this token must be used to get the next page.

          Optional: can be empty
  com.daml.ledger.api.v2.GetActiveContractsRequest:
    type: object
    properties:
      activeAtOffset:
        type: string
        format: int64
        description: |-
          The offset at which the snapshot of the active contracts will be computed.
          Must be no greater than the current ledger end offset.
          Must be greater than or equal to the last pruning offset.
          Must be a valid absolute offset (positive integer) or ledger begin offset (zero).
          If zero, the empty set will be returned.

          Required
      eventFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        description: |-
          Format of the contract_entries in the result. In case of CreatedEvent the presentation will be of
          TRANSACTION_SHAPE_ACS_DELTA.

          Required
      streamContinuationToken:
        type: string
        format: byte
        description: |-
          - subsequent request must be executed on the same participant with the same version of canton,
          - subsequent request must have the same active_at_offset,
          - subsequent request must have the same event_format
          - and the participant must not have been pruned after the active_at_offset.

          If not specified, the whole active contracts snapshot will be returned.

          Optional: can be empty
        title: |-
          Opaque representation of a continuation token defining a position in the active contracts snapshot.
          The prefix of the active contracts snapshot will be omitted up to and including the element from which
          the continuation token was read.
          To reuse the continuation token from a `GetActiveContractsPageResponse`:
    description: |-
      If the given offset is different than the ledger end, and there are (un)assignments in-flight at the given offset,
      the snapshot may fail with "FAILED_PRECONDITION/PARTICIPANT_PRUNED_DATA_ACCESSED".
      Note that it is ok to request acs snapshots for party migration with offsets other than ledger end, because party
      migration is not concerned with incomplete (un)assignments.
  com.daml.ledger.api.v2.GetActiveContractsResponse:
    type: object
    properties:
      workflowId:
        type: string
        description: |-
          The workflow ID used in command submission which corresponds to the contract_entry. Only set if
          the ``workflow_id`` for the command was set.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      activeContract:
        $ref: '#/definitions/com.daml.ledger.api.v2.ActiveContract'
        description: |-
          The contract is active on the assigned synchronizer, meaning: there was an activation event on the given synchronizer (
          created, assigned), which is not followed by a deactivation event (archived, unassigned) on the same
          synchronizer, until the active_at_offset.
          Since activeness is defined as a per synchronizer concept, it is possible, that a contract is active on one
          synchronizer, but already archived on another.
          There will be one such message for each synchronizer the contract is active on.
      incompleteUnassigned:
        $ref: '#/definitions/com.daml.ledger.api.v2.IncompleteUnassigned'
        description: |-
          Included iff the unassigned event was before or at the active_at_offset, but there was no corresponding
          assigned event before or at the active_at_offset.
      incompleteAssigned:
        $ref: '#/definitions/com.daml.ledger.api.v2.IncompleteAssigned'
        description: |-
          Important: this message is not indicating that the contract is active on the target synchronizer!
          Included iff the assigned event was before or at the active_at_offset, but there was no corresponding
          unassigned event before or at the active_at_offset.
      streamContinuationToken:
        type: string
        format: byte
        description: |-
          Opaque representation of a continuation token which can be used in the request to bypass the already processed part
          of the active contracts snapshot.
          Only populated for the streaming ``GetActiveContracts`` rpc call.

          Optional: can be empty
  com.daml.ledger.api.v2.GetConnectedSynchronizersResponse:
    type: object
    properties:
      connectedSynchronizers:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.GetConnectedSynchronizersResponse.ConnectedSynchronizer'
        title: 'Optional: can be empty'
  com.daml.ledger.api.v2.GetConnectedSynchronizersResponse.ConnectedSynchronizer:
    type: object
    properties:
      synchronizerAlias:
        type: string
        description: Required
        title: The alias of the synchronizer
      synchronizerId:
        type: string
        description: Required
        title: The ID of the synchronizer
      permission:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantPermission'
        description: |-
          The permission on the synchronizer
          Set if a party was used in the request, otherwise unspecified.

          Optional
  com.daml.ledger.api.v2.GetContractRequest:
    type: object
    properties:
      contractId:
        type: string
        description: |-
          The ID of the contract.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      queryingParties:
        type: array
        items:
          type: string
        description: |-
          The list of querying parties
          The stakeholders of the referenced contract must have an intersection with any of these parties
          to return the result.
          If no querying_parties specified, all possible contracts could be returned.

          Optional: can be empty
  com.daml.ledger.api.v2.GetContractResponse:
    type: object
    properties:
      createdEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          - offset
          - node_id
          - created_event_blob
          - interface_views
          - acs_delta

          Required
        title: |-
          The representative_package_id will be always set to the contract package ID, therefore this endpoint should
          not be used to lookup contract which entered the participant via party replication or repair service.
          The witnesses field will contain only the querying_parties which are also stakeholders of the contract as well.
          The following fields of the created event cannot be populated, so those should not be used / parsed:
  com.daml.ledger.api.v2.GetEventsByContractIdRequest:
    type: object
    properties:
      contractId:
        type: string
        description: |-
          The contract id being queried.

          Required
      eventFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        description: |-
          Format of the events in the result, the presentation will be of TRANSACTION_SHAPE_ACS_DELTA.

          Required
  com.daml.ledger.api.v2.GetEventsByContractIdResponse:
    type: object
    properties:
      created:
        $ref: '#/definitions/com.daml.ledger.api.v2.Created'
        description: |-
          The create event for the contract with the ``contract_id`` given in the request
          provided it exists and has not yet been pruned.

          Optional
      archived:
        $ref: '#/definitions/com.daml.ledger.api.v2.Archived'
        description: |-
          The archive event for the contract with the ``contract_id`` given in the request
          provided such an archive event exists and it has not yet been pruned.

          Optional
  com.daml.ledger.api.v2.GetLatestPrunedOffsetsResponse:
    type: object
    properties:
      participantPrunedUpToInclusive:
        type: string
        format: int64
        description: |-
          It will always be a non-negative integer.
          If positive, the absolute offset up to which the ledger has been pruned,
          disregarding the state of all divulged contracts pruning.
          If zero, the ledger has not been pruned yet.

          Optional
      allDivulgedContractsPrunedUpToInclusive:
        type: string
        format: int64
        description: |-
          It will always be a non-negative integer.
          If positive, the absolute offset up to which all divulged events have been pruned on the ledger.
          It can be at or before the ``participant_pruned_up_to_inclusive`` offset.
          For more details about all divulged events pruning,
          see ``PruneRequest.prune_all_divulged_contracts`` in ``participant_pruning_service.proto``.
          If zero, the divulged events have not been pruned yet.

          Optional
  com.daml.ledger.api.v2.GetLedgerApiVersionResponse:
    type: object
    properties:
      version:
        type: string
        description: |-
          The version of the ledger API.

          Required
      features:
        $ref: '#/definitions/com.daml.ledger.api.v2.FeaturesDescriptor'
        description: |-
          The features supported by this Ledger API endpoint.

          Daml applications CAN use the feature descriptor on top of
          version constraints on the Ledger API version to determine
          whether a given Ledger API endpoint supports the features
          required to run the application.

          See the feature descriptions themselves for the relation between
          Ledger API versions and feature presence.

          Required
  com.daml.ledger.api.v2.GetLedgerEndResponse:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: |-
          It will always be a non-negative integer.
          If zero, the participant view of the ledger is empty.
          If positive, the absolute offset of the ledger as viewed by the participant.

          Optional
  com.daml.ledger.api.v2.GetPackageResponse:
    type: object
    properties:
      hashFunction:
        $ref: '#/definitions/com.daml.ledger.api.v2.HashFunction'
        description: |-
          The hash function we use to calculate the hash.

          Required
      archivePayload:
        type: string
        format: byte
        description: |-
          Contains a ``daml_lf`` ArchivePayload. See further details in ``daml_lf.proto``.

          Required: must be non-empty
      hash:
        type: string
        description: |-
          The hash of the archive payload, can also used as a ``package_id``.
          Must be a valid PackageIdString (as described in ``value.proto``).

          Required
  com.daml.ledger.api.v2.GetPackageStatusResponse:
    type: object
    properties:
      packageStatus:
        $ref: '#/definitions/com.daml.ledger.api.v2.PackageStatus'
        description: |-
          The status of the package.

          Required
  com.daml.ledger.api.v2.GetUpdateByIdRequest:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          The ID of a particular update.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      updateFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.UpdateFormat'
        description: |-
          The format for the update.

          Required
  com.daml.ledger.api.v2.GetUpdateByOffsetRequest:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: |-
          The offset of the update being looked up.
          Must be a valid absolute offset (positive integer).

          Required
      updateFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.UpdateFormat'
        description: |-
          The format for the update.

          Required
  com.daml.ledger.api.v2.GetUpdateResponse:
    type: object
    properties:
      transaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.Transaction'
      reassignment:
        $ref: '#/definitions/com.daml.ledger.api.v2.Reassignment'
      topologyTransaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.TopologyTransaction'
  com.daml.ledger.api.v2.GetUpdatesPageRequest:
    type: object
    properties:
      beginOffsetExclusive:
        type: string
        format: int64
        description: |-
          Exclusive lower bound offset of the requested ledger section (non-negative integer).
          The response page will only contain updates whose offset is strictly greater than this.
          If set to zero or not defined, the lower bound is set to the actual pruning offset or to the beginning of the
          ledger if the participant was not pruned yet.
          If set to positive and the ledger has been pruned, this parameter must be greater or equal than the pruning offset.

          Optional
      endOffsetInclusive:
        type: string
        format: int64
        description: |-
          Inclusive upper bound offset of the requested ledger section.
          If specified the response will only contain updates whose offset is less than or equal to this.
          If not specified response will only contain updates whose offset is less than the current ledger-end.

          Optional
      maxPageSize:
        type: integer
        format: int32
        description: |-
          The result page will contain the first max_page_size Updates of all matching updates.
          The server may reject queries with max_page_size above server specified limits.
          If not specified, the default max_page_size is determined by the server.

          Optional
      updateFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.UpdateFormat'
        title: Required
      descendingOrder:
        type: boolean
        description: |-
          If set, the page will populate the elements in descending order starting from the end_offset_inclusive.

          Optional
      pageToken:
        type: string
        format: byte
        description: |-
          - be executed on the same participant with the same version of canton,
          - have the same begin_offset_exclusive,
          - have the same end_offset_inclusive,
          - have the same update_format and
          - have the same descending_order.

          If not specified, the first page of updates will be returned.

          Optional: can be empty
        title: |-
          To get the next page of updates, the ``page_token`` should be set to the
          ``next_page_token`` of the last ``GetUpdatesPageResponse``.
          To achieve correct paging: subsequent requests must
  com.daml.ledger.api.v2.GetUpdatesPageResponse:
    type: object
    properties:
      updates:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdateResponse'
        description: |-
          The first max_page_size updates that match the filter in the request.
          In case descending_order was selected, the order of the updates is in reversed offset order.

          Optional: can be empty
      lowestPageOffsetExclusive:
        type: string
        format: int64
        description: |-
          Represents the lower bound of this page.

          Required
      highestPageOffsetInclusive:
        type: string
        format: int64
        description: |-
          Represents the upper bound of the page.

          Required
      nextPageToken:
        type: string
        format: byte
        description: |-
          If the value is not populated, this is the last page.
          If the value is populated, this token can be used to get the next page.
          If the original ``GetFirstUpdatePageRequest`` end_offset_inclusive was not specified and the request uses
          ascending order, then this token will always be populated, so you can use it to "tail" the ledger by
          repeatedly polling with the new page token returned.

          Optional: can be empty
  com.daml.ledger.api.v2.GetUpdatesRequest:
    type: object
    properties:
      beginExclusive:
        type: string
        format: int64
        title: Required
      endInclusive:
        type: string
        format: int64
        description: |-
          - the descending_order must not be selected,
          - the stream will not terminate.

          Optional
        title: |-
          Inclusive higher bound offset of the requested ledger section.
          If specified the response will only contain transactions whose offset is less than or equal to this.
          If not specified,
      updateFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.UpdateFormat'
        description: Required
        title: The update format for this request
      descendingOrder:
        type: boolean
        description: |-
          If set, the stream will populate the elements in descending order.

          Optional
    description: |-
      Exclusive lower bound offset of the requested ledger section (non-negative integer).
       The response will only contain transactions whose offset is strictly greater than this.
       If set to zero, the lower bound is set to the beginning of the ledger.
       If the participant has been pruned, this parameter must be greater or equal than the pruning offset.
  com.daml.ledger.api.v2.GetUpdatesResponse:
    type: object
    properties:
      transaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.Transaction'
      reassignment:
        $ref: '#/definitions/com.daml.ledger.api.v2.Reassignment'
      offsetCheckpoint:
        $ref: '#/definitions/com.daml.ledger.api.v2.OffsetCheckpoint'
      topologyTransaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.TopologyTransaction'
  com.daml.ledger.api.v2.HashFunction:
    type: string
    enum:
      - HASH_FUNCTION_SHA256
    default: HASH_FUNCTION_SHA256
  com.daml.ledger.api.v2.Identifier:
    type: object
    properties:
      packageId:
        type: string
        description: |-
          Generally, the identifier of the Daml package that contains the entity.
          When encoding a package-id, it must be a valid PackageIdString.

          The field is overloaded to also be able to contain the package-name of the Daml package.
          This is supported if the entity referenced is either an interface or template.
          When representing the Daml package-name, the encoding is of form `#<package-name>`
          where `#` (not a valid package-id character)
          is used as a discriminator for signalling a package-name encoding.

          Required
      moduleName:
        type: string
        title: |-
          The dot-separated module name of the identifier.
          Required
      entityName:
        type: string
        title: |-
          The dot-separated name of the entity (e.g. record, template, ...) within the module.
          Required
    description: |-
      - if a Daml package-id is encoded in the package_id field, it is referred to as using a "package-id reference format"
        - if a Daml package-name is encoded in the package_id field, it is referred to as using a "package-name reference format"
    title: |-
      Unique identifier of an entity.
      Throughout this API, the following terminology is being used:
  com.daml.ledger.api.v2.IncompleteAssigned:
    type: object
    properties:
      assignedEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.AssignedEvent'
        title: Required
  com.daml.ledger.api.v2.IncompleteUnassigned:
    type: object
    properties:
      createdEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.CreatedEvent'
        description: |-
          The event as it appeared in the context of its last activation update (i.e. daml transaction or
          reassignment). In particular, the last activation offset, node_id pair is preserved.
          The last activation update is the most recent update created or assigned this contract on synchronizer_id synchronizer before
          the unassigned_event.
          The offset of the CreatedEvent might point to an already pruned update, therefore it cannot necessarily be used
          for lookups.

          Required
      unassignedEvent:
        $ref: '#/definitions/com.daml.ledger.api.v2.UnassignedEvent'
        title: Required
  com.daml.ledger.api.v2.InterfaceFilter:
    type: object
    properties:
      interfaceId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The interface that a matching contract must implement.
          The ``interface_id`` needs to be valid: corresponding interface should be defined in
          one of the available packages at the time of the query.
          Both package-name and package-id reference formats for the identifier are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      includeInterfaceView:
        type: boolean
        description: |-
          Whether to include the interface view on the contract in the returned ``CreatedEvent``.
          Use this to access contract data in a uniform manner in your API client.

          Optional
      includeCreatedEventBlob:
        type: boolean
        description: |-
          Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
          Use this to access the contract create event payload in your API client
          for submitting it as a disclosed contract with future commands.

          Optional
    description: This filter matches contracts that implement a specific interface.
  com.daml.ledger.api.v2.InterfaceView:
    type: object
    properties:
      interfaceId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The interface implemented by the matched event.
          The identifier uses the package-id reference format.

          Required
      viewStatus:
        $ref: '#/definitions/google.rpc.Status'
        description: |-
          Whether the view was successfully computed, and if not,
          the reason for the error. The error is reported using the same rules
          for error codes and messages as the errors returned for API requests.

          Required
      viewValue:
        $ref: '#/definitions/com.daml.ledger.api.v2.Record'
        description: |-
          The value of the interface's view method on this event.
          Set if it was requested in the ``InterfaceFilter`` and it could be
          successfully computed.

          Optional
      implementationPackageId:
        type: string
        description: |-
          The package defining the interface implementation used to compute the view.
          Can be different from the package that was used to create the contract itself,
          as the contract arguments can be upgraded or downgraded using smart-contract upgrading
          as part of computing the interface view.
          Populated if the view computation is successful, otherwise empty.

          Optional
    description: View of a create event matched by an interface filter.
  com.daml.ledger.api.v2.List:
    type: object
    properties:
      elements:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: |-
          The elements must all be of the same concrete value type.
          Optional
    description: A homogenous collection of values.
  com.daml.ledger.api.v2.ListPackagesResponse:
    type: object
    properties:
      packageIds:
        type: array
        items:
          type: string
        description: |-
          The IDs of all Daml-LF packages supported by the server.
          Each element must be a valid PackageIdString (as described in ``value.proto``).

          Required: must be non-empty
  com.daml.ledger.api.v2.ListVettedPackagesRequest:
    type: object
    properties:
      packageMetadataFilter:
        $ref: '#/definitions/com.daml.ledger.api.v2.PackageMetadataFilter'
        description: |-
          The package metadata filter the returned vetted packages set must satisfy.

          Optional
      topologyStateFilter:
        $ref: '#/definitions/com.daml.ledger.api.v2.TopologyStateFilter'
        description: |-
          The topology filter the returned vetted packages set must satisfy.

          Optional
      pageToken:
        type: string
        description: |-
          Pagination token to determine the specific page to fetch. Using the token
          guarantees that ``VettedPackages`` on a subsequent page are all greater
          (``VettedPackages`` are sorted by synchronizer ID then participant ID) than
          the last ``VettedPackages`` on a previous page.

          The server does not store intermediate results between calls chained by a
          series of page tokens. As a consequence, if new vetted packages are being
          added and a page is requested twice using the same token, more packages can
          be returned on the second call.

          Leave unspecified (i.e. as empty string) to fetch the first page.

          Optional
      pageSize:
        type: integer
        format: int64
        description: |-
          Maximum number of ``VettedPackages`` results to return in a single page.

          If the page_size is unspecified (i.e. left as 0), the server will decide
          the number of results to be returned.

          If the page_size exceeds the maximum supported by the server, an
          error will be returned.

          To obtain the server's maximum consult the PackageService descriptor
          available in the VersionService.

          Optional
  com.daml.ledger.api.v2.ListVettedPackagesResponse:
    type: object
    properties:
      vettedPackages:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.VettedPackages'
        description: |-
          All ``VettedPackages`` that contain at least one ``VettedPackage`` matching
          both a ``PackageMetadataFilter`` and a ``TopologyStateFilter``.
          Sorted by synchronizer_id then participant_id.

          Optional: can be empty
      nextPageToken:
        type: string
        description: |-
          Pagination token to retrieve the next page.
          Empty string if there are no further results.

          Optional
  com.daml.ledger.api.v2.OffsetCheckpoint:
    type: object
    properties:
      offset:
        type: string
        format: int64
        description: |-
          The participant's offset, the details of the offset field are described in ``community/ledger-api/README.md``.
          Must be a valid absolute offset (positive integer).

          Required
      synchronizerTimes:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.SynchronizerTime'
        description: |-
          The times associated with each synchronizer at this offset.

          Optional: can be empty
    description: |-
      - detect time out of commands.
      - provide an offset which can be used to restart consumption.
    title: 'OffsetCheckpoints may be used to:'
  com.daml.ledger.api.v2.OffsetCheckpointFeature:
    type: object
    properties:
      maxOffsetCheckpointEmissionDelay:
        type: string
        description: Required
        title: The maximum delay to emmit a new OffsetCheckpoint if it exists
  com.daml.ledger.api.v2.Optional:
    type: object
    properties:
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: optional
    description: |-
      Corresponds to Java's Optional type, Scala's Option, and Haskell's Maybe.
      The reason why we need to wrap this in an additional ``message`` is that we
      need to be able to encode the ``None`` case in the ``Value`` oneof.
  com.daml.ledger.api.v2.PackageFeature:
    type: object
    properties:
      maxVettedPackagesPageSize:
        type: integer
        format: int32
        description: |-
          The maximum number of vetted packages the server can return in a single
          response (page) when listing them.

          Required
  com.daml.ledger.api.v2.PackageMetadataFilter:
    type: object
    properties:
      packageIds:
        type: array
        items:
          type: string
        description: |-
          If this list is non-empty, any vetted package with a package ID in this
          list will match the filter.

          Optional: can be empty
      packageNamePrefixes:
        type: array
        items:
          type: string
        description: |-
          If this list is non-empty, any vetted package with a name matching at least
          one prefix in this list will match the filter.

          Optional: can be empty
    description: |-
      Filter the VettedPackages by package metadata.

      A PackageMetadataFilter without package_ids and without package_name_prefixes
      matches any vetted package.

      Non-empty fields specify candidate values of which at least one must match.
      If both fields are set, then a candidate is returned if it matches one of the fields.
  com.daml.ledger.api.v2.PackageReference:
    type: object
    properties:
      packageId:
        type: string
        title: Required
      packageName:
        type: string
        title: Required
      packageVersion:
        type: string
        title: Required
  com.daml.ledger.api.v2.PackageStatus:
    type: string
    enum:
      - PACKAGE_STATUS_UNSPECIFIED
      - PACKAGE_STATUS_REGISTERED
    default: PACKAGE_STATUS_UNSPECIFIED
    description: |2-
       - PACKAGE_STATUS_UNSPECIFIED: The server is not aware of such a package.
       - PACKAGE_STATUS_REGISTERED: The server is able to execute Daml commands operating on this package.
  com.daml.ledger.api.v2.ParticipantAuthorizationAdded:
    type: object
    properties:
      partyId:
        type: string
        title: Required
      participantId:
        type: string
        title: Required
      participantPermission:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantPermission'
        title: Required
  com.daml.ledger.api.v2.ParticipantAuthorizationChanged:
    type: object
    properties:
      partyId:
        type: string
        title: Required
      participantId:
        type: string
        title: Required
      participantPermission:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantPermission'
        title: Required
  com.daml.ledger.api.v2.ParticipantAuthorizationOnboarding:
    type: object
    properties:
      partyId:
        type: string
        title: Required
      participantId:
        type: string
        title: Required
      participantPermission:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantPermission'
        title: Required
  com.daml.ledger.api.v2.ParticipantAuthorizationRevoked:
    type: object
    properties:
      partyId:
        type: string
        title: Required
      participantId:
        type: string
        title: Required
  com.daml.ledger.api.v2.ParticipantAuthorizationTopologyFormat:
    type: object
    properties:
      parties:
        type: array
        items:
          type: string
        description: |-
          List of parties for which the topology transactions should be sent.
          Empty means: for all parties.

          Optional: can be empty
    description: A format specifying which participant authorization topology transactions to include and how to render them.
  com.daml.ledger.api.v2.ParticipantPermission:
    type: string
    enum:
      - PARTICIPANT_PERMISSION_UNSPECIFIED
      - PARTICIPANT_PERMISSION_SUBMISSION
      - PARTICIPANT_PERMISSION_CONFIRMATION
      - PARTICIPANT_PERMISSION_OBSERVATION
    default: PARTICIPANT_PERMISSION_UNSPECIFIED
    description: |-
      Enum indicating the permission level that the participant has for the party
      whose connected synchronizers are being listed.

       - PARTICIPANT_PERMISSION_CONFIRMATION: participant can only confirm transactions
       - PARTICIPANT_PERMISSION_OBSERVATION: participant can only observe transactions
  com.daml.ledger.api.v2.PartyManagementFeature:
    type: object
    properties:
      maxPartiesPageSize:
        type: integer
        format: int32
        description: |-
          The maximum number of parties the server can return in a single response (page).

          Required
  com.daml.ledger.api.v2.PrefetchContractKey:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of contract the client wants to prefetch.
          Both package-name and package-id reference identifier formats for the template-id are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      contractKey:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        description: |-
          The key of the contract the client wants to prefetch.

          Required
    title: Preload contracts
  com.daml.ledger.api.v2.PriorTopologySerial:
    type: object
    properties:
      prior:
        type: integer
        format: int64
        description: Previous transaction's serial.
      noPrior:
        type: object
        properties: {}
        description: No previous transaction exists.
    description: |-
      The serial of last ``VettedPackages`` topology transaction on a given
      participant and synchronizer.
  com.daml.ledger.api.v2.Reassignment:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          Assigned by the server. Useful for correlating logs.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      commandId:
        type: string
        description: |-
          The ID of the command which resulted in this reassignment. Missing for everyone except the submitting party on the submitting participant.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      workflowId:
        type: string
        description: |-
          The workflow ID used in reassignment command submission. Only set if the ``workflow_id`` for the command was set.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      offset:
        type: string
        format: int64
        description: |-
          The participant's offset. The details of this field are described in ``community/ledger-api/README.md``.
          Must be a valid absolute offset (positive integer).

          Required
      events:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.ReassignmentEvent'
        description: |-
          The collection of reassignment events.

          Required: must be non-empty
      traceContext:
        $ref: '#/definitions/com.daml.ledger.api.v2.TraceContext'
        description: |-
          The trace context transported in this message corresponds to the trace context supplied
          by the client application in a HTTP2 header of the original command submission.
          We typically use a header to transfer this type of information. Here we use message
          body, because it is used in gRPC streams which do not support per message headers.
          This field will be populated with the trace context contained in the original submission.
          If that was not provided, a unique ledger-api-server generated trace context will be used
          instead.

          Optional
        title: Ledger API trace context
      recordTime:
        type: string
        format: date-time
        description: |-
          The time at which the reassignment was recorded. The record time refers to the source/target
          synchronizer for an unassign/assign event respectively.

          Required
      synchronizerId:
        type: string
        description: |-
          A valid synchronizer id.
          Identifies the synchronizer that synchronized this Reassignment.

          Required
      paidTrafficCost:
        type: string
        format: int64
        description: |-
          The traffic cost that this participant node paid for the corresponding (un)assignment request.

          Not set for transactions that were
          - initiated by another participant
          - initiated offline via the repair service
          - processed before the participant started serving traffic cost on the Ledger API
          - returned as part of a query filtering for a non submitting party

          Optional
    description: Complete view of an on-ledger reassignment.
  com.daml.ledger.api.v2.ReassignmentCommand:
    type: object
    properties:
      unassignCommand:
        $ref: '#/definitions/com.daml.ledger.api.v2.UnassignCommand'
      assignCommand:
        $ref: '#/definitions/com.daml.ledger.api.v2.AssignCommand'
  com.daml.ledger.api.v2.ReassignmentCommands:
    type: object
    properties:
      workflowId:
        type: string
        description: |-
          Identifier of the on-ledger workflow that this command is a part of.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      userId:
        type: string
        description: |-
          Uniquely identifies the participant user that issued the command.
          Must be a valid UserIdString (as described in ``value.proto``).
          Required unless authentication is used with a user token.
          In that case, the token's user-id will be used for the request's user_id.

          Optional
      commandId:
        type: string
        description: |-
          Uniquely identifies the command.
          The triple (user_id, submitter, command_id) constitutes the change ID for the intended ledger change.
          The change ID can be used for matching the intended ledger changes with all their completions.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      submitter:
        type: string
        description: |-
          Party on whose behalf the command should be executed.
          If ledger API authorization is enabled, then the authorization metadata must authorize the sender of the request
          to act on behalf of the given party.
          Must be a valid PartyIdString (as described in ``value.proto``).

          Required
      submissionId:
        type: string
        description: |-
          A unique identifier to distinguish completions for different submissions with the same change ID.
          Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
          with the same change ID.
          Must be a valid LedgerString (as described in ``value.proto``).

          If omitted, the participant or the committer may set a value of their choice.

          Optional
      commands:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.ReassignmentCommand'
        description: |-
          Individual elements of this reassignment. Must be non-empty.

          Required: must be non-empty
  com.daml.ledger.api.v2.ReassignmentEvent:
    type: object
    properties:
      unassigned:
        $ref: '#/definitions/com.daml.ledger.api.v2.UnassignedEvent'
      assigned:
        $ref: '#/definitions/com.daml.ledger.api.v2.AssignedEvent'
  com.daml.ledger.api.v2.Record:
    type: object
    properties:
      recordId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          Omitted from the transaction stream when verbose streaming is not enabled.
          Optional when submitting commands.
      fields:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.RecordField'
        title: |-
          The nested values of the record.
          Required
    description: Contains nested values.
  com.daml.ledger.api.v2.RecordField:
    type: object
    properties:
      label:
        type: string
        description: |-
          - if all keys within a single record are present, the order in which fields appear does not matter. however, each key must appear exactly once.
          - if any of the keys within a single record are omitted, the order of fields MUST match the order of declaration in the Daml template.

          Must be a valid NameString
        title: |-
          When reading a transaction stream, it's omitted if verbose streaming is not enabled.
          When submitting a command, it's optional:
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: |-
          A nested value of a record.
          Required
    description: A named nested value within a record.
  com.daml.ledger.api.v2.Signature:
    type: object
    properties:
      format:
        $ref: '#/definitions/com.daml.ledger.api.v2.SignatureFormat'
        title: Required
      signature:
        type: string
        format: byte
        title: 'Required: must be non-empty'
      signedBy:
        type: string
        description: |-
          The fingerprint/id of the keypair used to create this signature and needed to verify.

          Required
      signingAlgorithmSpec:
        $ref: '#/definitions/com.daml.ledger.api.v2.SigningAlgorithmSpec'
        description: Required
        title: The signing algorithm specification used to produce this signature
  com.daml.ledger.api.v2.SignatureFormat:
    type: string
    enum:
      - SIGNATURE_FORMAT_UNSPECIFIED
      - SIGNATURE_FORMAT_RAW
      - SIGNATURE_FORMAT_DER
      - SIGNATURE_FORMAT_CONCAT
      - SIGNATURE_FORMAT_SYMBOLIC
    default: SIGNATURE_FORMAT_UNSPECIFIED
    title: |-
      - SIGNATURE_FORMAT_RAW: Signature scheme specific signature format
      Legacy format no longer used, except for migrations
       - SIGNATURE_FORMAT_DER: ASN.1 + DER-encoding of the `r` and `s` integers, as defined in https://datatracker.ietf.org/doc/html/rfc3279#section-2.2.3
      Used for ECDSA signatures
       - SIGNATURE_FORMAT_CONCAT: Concatenation of the integers `r || s` in little-endian form, as defined in https://datatracker.ietf.org/doc/html/rfc8032#section-3.3
      Note that this is different from the format defined in IEEE P1363, which uses concatenation in big-endian form.
      Used for EdDSA signatures
       - SIGNATURE_FORMAT_SYMBOLIC: Symbolic crypto, must only be used for testing
  com.daml.ledger.api.v2.SigningAlgorithmSpec:
    type: string
    enum:
      - SIGNING_ALGORITHM_SPEC_UNSPECIFIED
      - SIGNING_ALGORITHM_SPEC_ED25519
      - SIGNING_ALGORITHM_SPEC_EC_DSA_SHA_256
      - SIGNING_ALGORITHM_SPEC_EC_DSA_SHA_384
    default: SIGNING_ALGORITHM_SPEC_UNSPECIFIED
    title: |-
      - SIGNING_ALGORITHM_SPEC_ED25519: EdDSA Signature based on Curve25519 with SHA-512
      http://ed25519.cr.yp.to/
       - SIGNING_ALGORITHM_SPEC_EC_DSA_SHA_256: Elliptic Curve Digital Signature Algorithm with SHA256
       - SIGNING_ALGORITHM_SPEC_EC_DSA_SHA_384: Elliptic Curve Digital Signature Algorithm with SHA384
  com.daml.ledger.api.v2.SigningKeySpec:
    type: string
    enum:
      - SIGNING_KEY_SPEC_UNSPECIFIED
      - SIGNING_KEY_SPEC_EC_CURVE25519
      - SIGNING_KEY_SPEC_EC_P256
      - SIGNING_KEY_SPEC_EC_P384
      - SIGNING_KEY_SPEC_EC_SECP256K1
    default: SIGNING_KEY_SPEC_UNSPECIFIED
    title: |-
      - SIGNING_KEY_SPEC_EC_CURVE25519: Elliptic Curve Key from Curve25519
      as defined in http://ed25519.cr.yp.to/
       - SIGNING_KEY_SPEC_EC_P256: Elliptic Curve Key from the NIST P-256 curve (aka secp256r1)
      as defined in https://doi.org/10.6028/NIST.FIPS.186-4
       - SIGNING_KEY_SPEC_EC_P384: Elliptic Curve Key from the NIST P-384 curve (aka secp384r1)
      as defined in https://doi.org/10.6028/NIST.FIPS.186-4
       - SIGNING_KEY_SPEC_EC_SECP256K1: Elliptic Curve Key from SECG P256k1 curve (aka secp256k1)
      commonly used in bitcoin and ethereum
      as defined in https://www.secg.org/sec2-v2.pdf
  com.daml.ledger.api.v2.SigningPublicKey:
    type: object
    properties:
      format:
        $ref: '#/definitions/com.daml.ledger.api.v2.CryptoKeyFormat'
        description: Required
        title: The serialization format of the public key
      keyData:
        type: string
        format: byte
        description: 'Required: must be non-empty'
        title: Serialized public key in the format specified above
      keySpec:
        $ref: '#/definitions/com.daml.ledger.api.v2.SigningKeySpec'
        description: Required
        title: The key specification
  com.daml.ledger.api.v2.SubmitAndWaitForReassignmentRequest:
    type: object
    properties:
      reassignmentCommands:
        $ref: '#/definitions/com.daml.ledger.api.v2.ReassignmentCommands'
        description: |-
          The reassignment commands to be submitted.

          Required
      eventFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        description: |-
          If no event_format provided, the result will contain no events.
          The events in the result, will take shape TRANSACTION_SHAPE_ACS_DELTA.

          Optional
    description: This reassignment is executed as a single atomic update.
  com.daml.ledger.api.v2.SubmitAndWaitForReassignmentResponse:
    type: object
    properties:
      reassignment:
        $ref: '#/definitions/com.daml.ledger.api.v2.Reassignment'
        description: |-
          The reassignment that resulted from the submitted reassignment command.
          The reassignment might contain no events (request conditions result in filtering out all of them).

          Required
  com.daml.ledger.api.v2.SubmitAndWaitForTransactionRequest:
    type: object
    properties:
      commands:
        $ref: '#/definitions/com.daml.ledger.api.v2.Commands'
        description: |-
          The commands to be submitted.

          Required
      transactionFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.TransactionFormat'
        description: |-
          If no ``transaction_format`` is provided, a default will be used where ``transaction_shape`` is set to
          TRANSACTION_SHAPE_ACS_DELTA, ``event_format`` is defined with ``filters_by_party`` containing wildcard-template
          filter for all original ``act_as`` and ``read_as`` parties and the ``verbose`` flag is set.

          Optional
    description: These commands are executed as a single atomic transaction.
  com.daml.ledger.api.v2.SubmitAndWaitForTransactionResponse:
    type: object
    properties:
      transaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.Transaction'
        description: |-
          The transaction that resulted from the submitted command.
          The transaction might contain no events (request conditions result in filtering out all of them).

          Required
  com.daml.ledger.api.v2.SubmitAndWaitResponse:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          The id of the transaction that resulted from the submitted command.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      completionOffset:
        type: string
        format: int64
        description: |-
          The details of the offset field are described in ``community/ledger-api/README.md``.

          Required
  com.daml.ledger.api.v2.SubmitReassignmentRequest:
    type: object
    properties:
      reassignmentCommands:
        $ref: '#/definitions/com.daml.ledger.api.v2.ReassignmentCommands'
        description: |-
          The reassignment command to be submitted.

          Required
  com.daml.ledger.api.v2.SubmitReassignmentResponse:
    type: object
  com.daml.ledger.api.v2.SubmitResponse:
    type: object
  com.daml.ledger.api.v2.SynchronizerTime:
    type: object
    properties:
      synchronizerId:
        type: string
        description: |-
          The id of the synchronizer.

          Required
      recordTime:
        type: string
        format: date-time
        description: |-
          All commands with a maximum record time below this value MUST be considered lost if their completion has not arrived before this checkpoint.

          Required
  com.daml.ledger.api.v2.TemplateFilter:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          A template for which the payload should be included in the response.
          The ``template_id`` needs to be valid: corresponding template should be defined in
          one of the available packages at the time of the query.
          Both package-name and package-id reference formats for the identifier are supported.
          Note: The package-id reference identifier format is deprecated. We plan to end support for this format in version 3.4.

          Required
      includeCreatedEventBlob:
        type: boolean
        description: |-
          Whether to include a ``created_event_blob`` in the returned ``CreatedEvent``.
          Use this to access the contract event payload in your API client
          for submitting it as a disclosed contract with future commands.

          Optional
    description: This filter matches contracts of a specific template.
  com.daml.ledger.api.v2.TextMap:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.TextMap.Entry'
  com.daml.ledger.api.v2.TextMap.Entry:
    type: object
    properties:
      key:
        type: string
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
  com.daml.ledger.api.v2.TopologyEvent:
    type: object
    properties:
      participantAuthorizationChanged:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantAuthorizationChanged'
      participantAuthorizationRevoked:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantAuthorizationRevoked'
      participantAuthorizationAdded:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantAuthorizationAdded'
      participantAuthorizationOnboarding:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantAuthorizationOnboarding'
  com.daml.ledger.api.v2.TopologyFormat:
    type: object
    properties:
      includeParticipantAuthorizationEvents:
        $ref: '#/definitions/com.daml.ledger.api.v2.ParticipantAuthorizationTopologyFormat'
        description: |-
          Include participant authorization topology events in streams.
          If unset, no participant authorization topology events are emitted in the stream.

          Optional
    description: A format specifying which topology transactions to include and how to render them.
  com.daml.ledger.api.v2.TopologyStateFilter:
    type: object
    properties:
      participantIds:
        type: array
        items:
          type: string
        description: |-
          If this list is non-empty, only vetted packages hosted on participants
          listed in this field match the filter.
          Query the current Ledger API's participant's ID via the public
          ``GetParticipantId`` command in ``PartyManagementService``.

          Optional: can be empty
      synchronizerIds:
        type: array
        items:
          type: string
        description: |-
          If this list is non-empty, only vetted packages from the topology state of
          the synchronizers in this list match the filter.

          Optional: can be empty
    description: |-
      Filter the vetted packages by the participant and synchronizer that they are
      hosted on.

      Empty fields are ignored, such that a ``TopologyStateFilter`` without
      participant_ids and without synchronizer_ids matches a vetted package hosted
      on any participant and synchronizer.

      Non-empty fields specify candidate values of which at least one must match.
      If both fields are set then at least one candidate value must match from each
      field.
  com.daml.ledger.api.v2.TopologyTransaction:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          Assigned by the server. Useful for correlating logs.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      offset:
        type: string
        format: int64
        description: |-
          The absolute offset. The details of this field are described in ``community/ledger-api/README.md``.
          It is a valid absolute offset (positive integer).

          Required
      synchronizerId:
        type: string
        description: |-
          A valid synchronizer id.
          Identifies the synchronizer that synchronized the topology transaction.

          Required
      recordTime:
        type: string
        format: date-time
        description: |-
          The time at which the changes in the topology transaction become effective. There is a small delay between a
          topology transaction being sequenced and the changes it contains becoming effective. Topology transactions appear
          in order relative to a synchronizer based on their effective time rather than their sequencing time.

          Required
      events:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.TopologyEvent'
        description: |-
          A non-empty list of topology events.

          Required: must be non-empty
      traceContext:
        $ref: '#/definitions/com.daml.ledger.api.v2.TraceContext'
        description: |-
          The trace context transported in this message corresponds to the trace context supplied
          by the client application in a HTTP2 header of the original command submission.
          We typically use a header to transfer this type of information. Here we use message
          body, because it is used in gRPC streams which do not support per message headers.
          This field will be populated with the trace context contained in the original submission.
          If that was not provided, a unique ledger-api-server generated trace context will be used
          instead.

          Optional
        title: Ledger API trace context
  com.daml.ledger.api.v2.TraceContext:
    type: object
    properties:
      traceparent:
        type: string
        description: Optional
        title: https://www.w3.org/TR/trace-context/
      tracestate:
        type: string
        title: Optional
  com.daml.ledger.api.v2.Transaction:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          Assigned by the server. Useful for correlating logs.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      commandId:
        type: string
        description: |-
          The ID of the command which resulted in this transaction. Missing for everyone except the submitting party.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      workflowId:
        type: string
        description: |-
          The workflow ID used in command submission.
          Must be a valid LedgerString (as described in ``value.proto``).

          Optional
      effectiveAt:
        type: string
        format: date-time
        description: |-
          Ledger effective time.

          Required
      events:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.Event'
        description: |-
          - ``CreatedEvent`` or ``ArchivedEvent`` in case of ACS_DELTA transaction shape
          - ``CreatedEvent`` or ``ExercisedEvent`` in case of LEDGER_EFFECTS transaction shape

          Required: must be non-empty
        title: |-
          The collection of events.
          Contains:
      offset:
        type: string
        format: int64
        description: |-
          The absolute offset. The details of this field are described in ``community/ledger-api/README.md``.
          It is a valid absolute offset (positive integer).

          Required
      synchronizerId:
        type: string
        description: |-
          A valid synchronizer id.
          Identifies the synchronizer that synchronized the transaction.

          Required
      traceContext:
        $ref: '#/definitions/com.daml.ledger.api.v2.TraceContext'
        description: |-
          The trace context transported in this message corresponds to the trace context supplied
          by the client application in a HTTP2 header of the original command submission.
          We typically use a header to transfer this type of information. Here we use message
          body, because it is used in gRPC streams which do not support per message headers.
          This field will be populated with the trace context contained in the original submission.
          If that was not provided, a unique ledger-api-server generated trace context will be used
          instead.

          Optional
        title: Ledger API trace context
      recordTime:
        type: string
        format: date-time
        description: |-
          The time at which the transaction was recorded. The record time refers to the synchronizer
          which synchronized the transaction.

          Required
      externalTransactionHash:
        type: string
        format: byte
        description: |-
          For transaction externally signed, contains the external transaction hash
          signed by the external party. Can be used to correlate an external submission with a committed transaction.

          Optional: can be empty
      paidTrafficCost:
        type: string
        format: int64
        description: |-
          The traffic cost that this participant node paid for the confirmation
          request for this transaction.

          Not set for transactions that were
          - initiated by another participant
          - initiated offline via the repair service
          - processed before the participant started serving traffic cost on the Ledger API
          - returned as part of a query filtering for a non submitting party

          Optional
    description: Filtered view of an on-ledger transaction's create and archive events.
  com.daml.ledger.api.v2.TransactionFormat:
    type: object
    properties:
      eventFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        title: Required
      transactionShape:
        $ref: '#/definitions/com.daml.ledger.api.v2.TransactionShape'
        description: |-
          What transaction shape to use for interpreting the filters of the event format.

          Required
    description: |-
      A format that specifies what events to include in Daml transactions
      and what data to compute and include for them.
  com.daml.ledger.api.v2.TransactionShape:
    type: string
    enum:
      - TRANSACTION_SHAPE_UNSPECIFIED
      - TRANSACTION_SHAPE_ACS_DELTA
      - TRANSACTION_SHAPE_LEDGER_EFFECTS
    default: TRANSACTION_SHAPE_UNSPECIFIED
    description: |-
      Event shape for Transactions.
      Shapes are exclusive and only one of them can be defined in queries.

       - TRANSACTION_SHAPE_UNSPECIFIED: Following official proto3 convention, not intended for actual use.
       - TRANSACTION_SHAPE_ACS_DELTA: Transaction shape that is sufficient to maintain an accurate ACS view.
      The field witness_parties in events are populated as stakeholders, transaction filter will apply accordingly.
      This translates to create and archive events.
       - TRANSACTION_SHAPE_LEDGER_EFFECTS: Transaction shape that allows maintaining an ACS and also conveys detailed information about
      all exercises.
      The field witness_parties in events are populated as cumulative informees, transaction filter will apply accordingly.
      This translates to create, consuming exercise and non-consuming exercise.
  com.daml.ledger.api.v2.UnassignCommand:
    type: object
    properties:
      contractId:
        type: string
        description: |-
          The ID of the contract the client wants to unassign.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      source:
        type: string
        description: Required
        title: |-
          The ID of the source synchronizer
          Must be a valid synchronizer id
      target:
        type: string
        description: Required
        title: |-
          The ID of the target synchronizer
          Must be a valid synchronizer id
    title: Unassign a contract
  com.daml.ledger.api.v2.UnassignedEvent:
    type: object
    properties:
      reassignmentId:
        type: string
        description: |-
          The ID of the unassignment. This needs to be used as an input for a assign ReassignmentCommand.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      contractId:
        type: string
        description: |-
          The ID of the reassigned contract.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The template of the reassigned contract.
          The identifier uses the package-id reference format.

          Required
      source:
        type: string
        description: Required
        title: |-
          The ID of the source synchronizer
          Must be a valid synchronizer id
      target:
        type: string
        description: Required
        title: |-
          The ID of the target synchronizer
          Must be a valid synchronizer id
      submitter:
        type: string
        description: |-
          Party on whose behalf the unassign command was executed.
          Empty if the unassignment happened offline via the repair service.
          Must be a valid PartyIdString (as described in ``value.proto``).

          Optional
      reassignmentCounter:
        type: string
        format: uint64
        description: |-
          Each corresponding assigned and unassigned event has the same reassignment_counter. This strictly increases
          with each unassign command for the same contract. Creation of the contract corresponds to reassignment_counter
          equals zero.

          Required
      assignmentExclusivity:
        type: string
        format: date-time
        description: |-
          Assignment exclusivity
          Before this time (measured on the target synchronizer), only the submitter of the unassignment can initiate the assignment
          Defined for reassigning participants.

          Optional
      witnessParties:
        type: array
        items:
          type: string
        description: |-
          The parties that are notified of this event.

          Required: must be non-empty
      packageName:
        type: string
        description: |-
          The package name of the contract.

          Required
      offset:
        type: string
        format: int64
        description: Required
        title: |-
          The offset of origin.
          Offsets are managed by the participant nodes.
          Reassignments can thus NOT be assumed to have the same offsets on different participant nodes.
          Must be a valid absolute offset (positive integer)
      nodeId:
        type: integer
        format: int32
        description: Required
        title: |-
          The position of this event in the originating reassignment.
          Node IDs are not necessarily equal across participants,
          as these may see different projections/parts of reassignments.
          Must be valid node ID (non-negative integer)
    title: Records that a contract has been unassigned, and it becomes unusable on the source synchronizer
  com.daml.ledger.api.v2.UpdateFormat:
    type: object
    properties:
      includeTransactions:
        $ref: '#/definitions/com.daml.ledger.api.v2.TransactionFormat'
        description: |-
          Include Daml transactions in streams.
          If unset, no transactions are emitted in the stream.

          Optional
      includeReassignments:
        $ref: '#/definitions/com.daml.ledger.api.v2.EventFormat'
        description: |-
          Include (un)assignments in the stream.
          The events in the result take the shape TRANSACTION_SHAPE_ACS_DELTA.
          If unset, no (un)assignments are emitted in the stream.

          Optional
      includeTopologyEvents:
        $ref: '#/definitions/com.daml.ledger.api.v2.TopologyFormat'
        description: |-
          Include topology events in streams.
          If unset no topology events are emitted in the stream.

          Optional
    description: A format specifying what updates to include and how to render them.
  com.daml.ledger.api.v2.UserManagementFeature:
    type: object
    properties:
      supported:
        type: boolean
        description: |-
          Whether the Ledger API server provides the user management service.

          Required
      maxRightsPerUser:
        type: integer
        format: int32
        description: |-
          The maximum number of rights that can be assigned to a single user.
          Servers MUST support at least 100 rights per user.
          A value of 0 means that the server enforces no rights per user limit.

          Required
      maxUsersPageSize:
        type: integer
        format: int32
        description: |-
          The maximum number of users the server can return in a single response (page).
          Servers MUST support at least a 100 users per page.
          A value of 0 means that the server enforces no page size limit.

          Required
  com.daml.ledger.api.v2.Value:
    type: object
    properties:
      unit:
        type: object
        properties: {}
        description: This value is used for example for choices that don't take any arguments.
      bool:
        type: boolean
        description: True or false.
      int64:
        type: string
        format: int64
      date:
        type: integer
        format: int32
        title: |-
          Days since the unix epoch. Can go backwards. Limited from
          0001-01-01 to 9999-12-31, also to be compatible with
          https://www.ietf.org/rfc/rfc3339.txt
      timestamp:
        type: string
        format: int64
        title: |-
          Microseconds since the UNIX epoch. Can go backwards. Fixed
          since the vast majority of values will be greater than
          2^28, since currently the number of microseconds since the
          epoch is greater than that. Range: 0001-01-01T00:00:00Z to
          9999-12-31T23:59:59.999999Z, so that we can convert to/from
          https://www.ietf.org/rfc/rfc3339.txt
      numeric:
        type: string
        description: |-
          .. code-block:: none

            [+-]?\d{1,38}(.\d{0,37})?

          and should be representable by a Numeric without loss of precision.
        title: |-
          A Numeric, that is a decimal value with precision 38 (at most 38 significant digits) and a
          scale between 0 and 37 (significant digits on the right of the decimal point).
          The field has to match the regex
      party:
        type: string
        description: |-
          An agent operating on the ledger.
          Must be a valid PartyIdString.
      text:
        type: string
        description: A string.
      contractId:
        type: string
        description: |-
          Identifier of an on-ledger contract. Commands which reference an unknown or already archived contract ID will fail.
          Must be a valid LedgerString.
      optional:
        $ref: '#/definitions/com.daml.ledger.api.v2.Optional'
        title: The Optional type, None or Some
      list:
        $ref: '#/definitions/com.daml.ledger.api.v2.List'
        description: Represents a homogeneous list of values.
      textMap:
        $ref: '#/definitions/com.daml.ledger.api.v2.TextMap'
        title: The TextMap type
      genMap:
        $ref: '#/definitions/com.daml.ledger.api.v2.GenMap'
        title: The GenMap type
      record:
        $ref: '#/definitions/com.daml.ledger.api.v2.Record'
      variant:
        $ref: '#/definitions/com.daml.ledger.api.v2.Variant'
      enum:
        $ref: '#/definitions/com.daml.ledger.api.v2.Enum'
        title: The Enum type
    description: |-
      Encodes values that the ledger accepts as command arguments and emits as contract arguments.

      The values encoding use different classes of non-empty strings as identifiers. Those classes are
      defined as follows:

      - NameStrings are strings with length <= 1000 that match the regexp ``[A-Za-z\$_][A-Za-z0-9\$_]*``.
      - PackageIdStrings are strings with length <= 64 that match the regexp ``[A-Za-z0-9\-_ ]+``.
      - PartyIdStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9:\-_ ]+``.
      - ParticipantIdStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9:\-_ ]+``.
      - LedgerStrings are strings with length <= 255 that match the regexp ``[A-Za-z0-9#:\-_/ ]+``.
      - UserIdStrings are strings with length <= 128 that match the regexp ``[a-zA-Z0-9@^$.!`\-#+'~_|:]+``.
  com.daml.ledger.api.v2.Variant:
    type: object
    properties:
      variantId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          Omitted from the transaction stream when verbose streaming is not enabled.
          Optional when submitting commands.
      constructor:
        type: string
        title: |-
          Determines which of the Variant's alternatives is encoded in this message.
          Must be a valid NameString.
          Required
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: |-
          The value encoded within the Variant.
          Required
    description: A value with alternative representations.
  com.daml.ledger.api.v2.VettedPackage:
    type: object
    properties:
      packageId:
        type: string
        description: Required
        title: Package ID of this package
      validFromInclusive:
        type: string
        format: date-time
        description: |-
          The time from which this package is vetted. Empty if vetting time has no
          lower bound.

          Optional
      validUntilExclusive:
        type: string
        format: date-time
        description: |-
          The time until which this package is vetted. Empty if vetting time has no
          upper bound.

          Optional
      packageName:
        type: string
        description: |-
          Name of this package.
          Only available if the package has been uploaded to the current participant.

          Optional
      packageVersion:
        type: string
        description: |-
          Version of this package.
          Only available if the package has been uploaded to the current participant.

          Optional
    description: |-
      A package that is vetting on a given participant and synchronizer,
      modelled after ``VettedPackage`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_,
      enriched with the package name and version.
  com.daml.ledger.api.v2.VettedPackages:
    type: object
    properties:
      packages:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.VettedPackage'
        description: |-
          Sorted by package_name and package_version where known, and package_id as a
          last resort.

          Required: must be non-empty
      participantId:
        type: string
        description: |-
          Participant on which these packages are vetted.

          Required
      synchronizerId:
        type: string
        description: |-
          Synchronizer on which these packages are vetted.

          Required
      topologySerial:
        type: integer
        format: int64
        description: |-
          Serial of last ``VettedPackages`` topology transaction of this participant
          and on this synchronizer.

          Required
    description: |-
      The list of packages vetted on a given participant and synchronizer, modelled
      after ``VettedPackages`` in `topology.proto <https://github.com/digital-asset/canton/blob/main/community/base/src/main/protobuf/com/digitalasset/canton/protocol/v30/topology.proto#L206>`_.
