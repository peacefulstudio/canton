          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: user.id
          description: |-
            The user identifier, which must be a non-empty string of at most 128
            characters that are either alphanumeric ASCII characters or one of the symbols "@^$.!`-#+'~_|:()".

            Required
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UserManagementService.UpdateUserBody'
      tags:
        - UserManagementService
  /v2/users/{userId}:
    get:
