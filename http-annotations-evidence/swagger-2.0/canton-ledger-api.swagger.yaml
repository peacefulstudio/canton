swagger: "2.0"
info:
  title: com/daml/ledger/api/v2/admin/command_inspection_service.proto
  version: version not set
tags:
  - name: CommandInspectionService
  - name: IdentityProviderConfigService
  - name: PackageManagementService
  - name: ParticipantPruningService
  - name: PartyManagementService
  - name: UserManagementService
  - name: CommandCompletionService
  - name: CommandService
  - name: CommandSubmissionService
  - name: ContractService
  - name: EventQueryService
  - name: InteractiveSubmissionService
  - name: PackageService
  - name: StateService
  - name: UpdateService
  - name: VersionService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v2/commands/async/submit:
    post:
      summary: Submit a single composite command.
      operationId: CommandSubmissionService_Submit
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: commands
          description: |-
            The commands to be submitted in a single transaction.

            Required
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.Commands'
      tags:
        - CommandSubmissionService
  /v2/commands/async/submit-reassignment:
    post:
      summary: Submit a single reassignment.
      operationId: CommandSubmissionService_SubmitReassignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitReassignmentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitReassignmentRequest'
      tags:
        - CommandSubmissionService
  /v2/commands/completions:
    post:
      summary: Subscribe to command completion events.
      operationId: CommandCompletionService_CompletionStream
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/com.daml.ledger.api.v2.CompletionStreamResponse'
              error:
                $ref: '#/definitions/google.rpc.Status'
            title: Stream result of com.daml.ledger.api.v2.CompletionStreamResponse
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.CompletionStreamRequest'
      tags:
        - CommandCompletionService
  /v2/commands/submit-and-wait:
    post:
      summary: |-
        Submits a single composite command and waits for its result.
        Propagates the gRPC error of failed submissions including Daml interpretation errors.
      operationId: CommandService_SubmitAndWait
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitAndWaitResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: commands
          description: |-
            The commands to be submitted.

            Required
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.Commands'
      tags:
        - CommandService
  /v2/commands/submit-and-wait-for-reassignment:
    post:
      summary: |-
        Submits a single composite reassignment command, waits for its result, and returns the reassignment.
        Propagates the gRPC error of failed submission.
      operationId: CommandService_SubmitAndWaitForReassignment
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitAndWaitForReassignmentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          description: This reassignment is executed as a single atomic update.
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitAndWaitForReassignmentRequest'
      tags:
        - CommandService
  /v2/commands/submit-and-wait-for-transaction:
    post:
      summary: |-
        Submits a single composite command, waits for its result, and returns the transaction.
        Propagates the gRPC error of failed submissions including Daml interpretation errors.
      operationId: CommandService_SubmitAndWaitForTransaction
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitAndWaitForTransactionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          description: These commands are executed as a single atomic transaction.
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.SubmitAndWaitForTransactionRequest'
      tags:
        - CommandService
  /v2/contracts/contract-by-id:
    post:
      summary: |-
        Looking up contract data by contract ID.
        This endpoint is experimental / alpha, therefore no backwards compatibility is guaranteed.
        This endpoint must not be used to look up contracts which entered the participant via party replication
        or repair service.
        If there is no contract exist with the contract ID, or there is no intersection with the querying_parties,
        an CONTRACT_PAYLOAD_NOT_FOUND error will be raised.
      operationId: ContractService_GetContract
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetContractResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetContractRequest'
      tags:
        - ContractService
  /v2/dars:
    post:
      summary: Upload a DAR file to the participant.
      description: |-
        If vetting is enabled in the request, the DAR is checked for upgrade compatibility
        with the set of the already vetted packages on the target vetting synchronizer
        See UploadDarFileRequest for details regarding vetting and the target vetting synchronizer.
      operationId: PackageManagementService_UploadDarFile
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UploadDarFileResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UploadDarFileRequest'
      tags:
        - PackageManagementService
  /v2/dars/validate:
    post:
      summary: |-
        Validates the DAR and checks the upgrade compatibility of the DAR's packages
        with the set of the already vetted packages on the target vetting synchronizer.
        See ValidateDarFileRequest for details regarding the target vetting synchronizer.
      description: |-
        The operation has no effect on the state of the participant or the Canton ledger:
        the DAR payload and its packages are not persisted neither are the packages vetted.
      operationId: PackageManagementService_ValidateDarFile
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ValidateDarFileResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          description: |-
            Performs the same checks that UploadDarFileRequest would perform, but doesn't
            upload the DAR.
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ValidateDarFileRequest'
      tags:
        - PackageManagementService
  /v2/events/events-by-contract-id:
    post:
      summary: |-
        Get the create and the consuming exercise event for the contract with the provided ID.
        No events will be returned for contracts that have been pruned because they
        have already been archived before the latest pruning offset.
        If the contract cannot be found for the request, or all the contract-events are filtered, a CONTRACT_EVENTS_NOT_FOUND error will be raised.
      operationId: EventQueryService_GetEventsByContractId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetEventsByContractIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetEventsByContractIdRequest'
      tags:
        - EventQueryService
  /v2/idps:
    get:
      summary: List all existing identity provider configurations.
      operationId: IdentityProviderConfigService_ListIdentityProviderConfigs
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ListIdentityProviderConfigsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - IdentityProviderConfigService
    post:
      summary: |-
        Create a new identity provider configuration.
        The request will fail if the maximum allowed number of separate configurations is reached.
      operationId: IdentityProviderConfigService_CreateIdentityProviderConfig
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.CreateIdentityProviderConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.CreateIdentityProviderConfigRequest'
      tags:
        - IdentityProviderConfigService
  /v2/idps/{identityProviderConfig.identityProviderId}:
    patch:
      summary: |-
        Update selected modifiable attribute of an identity provider config resource described
        by the ``IdentityProviderConfig`` message.
      operationId: IdentityProviderConfigService_UpdateIdentityProviderConfig
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdateIdentityProviderConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: identityProviderConfig.identityProviderId
          description: |-
            The identity provider identifier
            Must be a valid LedgerString (as describe in ``value.proto``).

            Required
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.IdentityProviderConfigService.UpdateIdentityProviderConfigBody'
      tags:
        - IdentityProviderConfigService
  /v2/idps/{identityProviderId}:
    get:
      summary: Get the identity provider configuration data by id.
      operationId: IdentityProviderConfigService_GetIdentityProviderConfig
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GetIdentityProviderConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: identityProviderId
          description: Required
          in: path
          required: true
          type: string
      tags:
        - IdentityProviderConfigService
    delete:
      summary: Delete an existing identity provider configuration.
      operationId: IdentityProviderConfigService_DeleteIdentityProviderConfig
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.DeleteIdentityProviderConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: identityProviderId
          description: |-
            The identity provider config to delete.

            Required
          in: path
          required: true
          type: string
      tags:
        - IdentityProviderConfigService
  /v2/interactive-submission/execute:
    post:
      summary: |-
        Execute a prepared submission _asynchronously_ on the ledger.
        Requires a signature of the transaction from the submitting external party.
      operationId: InteractiveSubmissionService_ExecuteSubmission
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionRequest'
      tags:
        - InteractiveSubmissionService
  /v2/interactive-submission/executeAndWait:
    post:
      summary: |-
        Similar to ExecuteSubmission but _synchronously_ wait for the completion of the transaction
        IMPORTANT: Relying on the response from this endpoint requires trusting the Participant Node to be honest.
        A malicious node could make a successfully committed request appeared failed and vice versa
      operationId: InteractiveSubmissionService_ExecuteSubmissionAndWait
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitRequest'
      tags:
        - InteractiveSubmissionService
  /v2/interactive-submission/executeAndWaitForTransaction:
    post:
      summary: |-
        Similar to ExecuteSubmissionAndWait but additionally returns the transaction
        IMPORTANT: Relying on the response from this endpoint requires trusting the Participant Node to be honest.
        A malicious node could make a successfully committed request appear as failed and vice versa
      operationId: InteractiveSubmissionService_ExecuteSubmissionAndWaitForTransaction
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitForTransactionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitForTransactionRequest'
      tags:
        - InteractiveSubmissionService
  /v2/interactive-submission/preferred-package-version:
    get:
      summary: |-
        A preferred package is the highest-versioned package for a provided package-name
        that is vetted by all the participants hosting the provided parties.
      description: |-
        Ledger API clients should use this endpoint for constructing command submissions
        that are compatible with the provided preferred package, by making informed decisions on:
        - which are the compatible packages that can be used to create contracts
        - which contract or exercise choice argument version can be used in the command
        - which choices can be executed on a template or interface of a contract

        Can be accessed by any Ledger API client with a valid token when Ledger API authorization is enabled.

        Provided for backwards compatibility, it will be removed in the Canton version 3.4.0
      operationId: InteractiveSubmissionService_GetPreferredPackageVersion
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.GetPreferredPackageVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: parties
          description: |-
            The parties whose participants' vetting state should be considered when resolving the preferred package.

            Required: must be non-empty
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: packageName
          description: |-
            The package-name for which the preferred package should be resolved.

            Required
          in: query
          required: false
          type: string
        - name: synchronizerId
          description: |-
            The synchronizer whose vetting state should be used for resolving this query.
            If not specified, the vetting states of all synchronizers to which the participant is connected are used.

            Optional
          in: query
          required: false
          type: string
        - name: vettingValidAt
          description: |-
            The timestamp at which the package vetting validity should be computed
            on the latest topology snapshot as seen by the participant.
            If not provided, the participant's current clock time is used.

            Optional
          in: query
          required: false
          type: string
          format: date-time
      tags:
        - InteractiveSubmissionService
  /v2/interactive-submission/preferred-packages:
    post:
      summary: |-
        Compute the preferred packages for the vetting requirements in the request.
        A preferred package is the highest-versioned package for a provided package-name
        that is vetted by all the participants hosting the provided parties.
      description: |-
        Ledger API clients should use this endpoint for constructing command submissions
        that are compatible with the provided preferred packages, by making informed decisions on:
        - which are the compatible packages that can be used to create contracts
        - which contract or exercise choice argument version can be used in the command
        - which choices can be executed on a template or interface of a contract

        If the package preferences could not be computed due to no selection satisfying the requirements,
        a `FAILED_PRECONDITION` error will be returned.

        Can be accessed by any Ledger API client with a valid token when Ledger API authorization is enabled.

        Experimental API: this endpoint is not guaranteed to provide backwards compatibility in future releases
      operationId: InteractiveSubmissionService_GetPreferredPackages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.GetPreferredPackagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.GetPreferredPackagesRequest'
      tags:
        - InteractiveSubmissionService
  /v2/interactive-submission/prepare:
    post:
      summary: Requires `readAs` scope for the submitting party when LAPI User authorization is enabled
      operationId: InteractiveSubmissionService_PrepareSubmission
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PrepareSubmissionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PrepareSubmissionRequest'
      tags:
        - InteractiveSubmissionService
  /v2/package-vetting/list:
    post:
      summary: |-
        Lists which participant node vetted what packages on which synchronizer.
        Can be called by any authenticated user.
      operationId: PackageService_ListVettedPackages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.ListVettedPackagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.ListVettedPackagesRequest'
      tags:
        - PackageService
  /v2/package-vetting/update:
    post:
      summary: Update the vetted packages of this participant
      operationId: PackageManagementService_UpdateVettedPackages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdateVettedPackagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdateVettedPackagesRequest'
      tags:
        - PackageManagementService
  /v2/packages:
    get:
      summary: Returns the identifiers of all supported packages.
      operationId: PackageService_ListPackages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.ListPackagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - PackageService
  /v2/packages/{packageId}:
    get:
      summary: Returns the contents of a single package.
      operationId: PackageService_GetPackage
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetPackageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: packageId
          description: |-
            The ID of the requested package.
            Must be a valid PackageIdString (as described in ``value.proto``).

            Required
          in: path
          required: true
          type: string
      tags:
        - PackageService
  /v2/packages/{packageId}/status:
    get:
      summary: Returns the status of a single package.
      operationId: PackageService_GetPackageStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetPackageStatusResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: packageId
          description: |-
            The ID of the requested package.
            Must be a valid PackageIdString (as described in ``value.proto``).

            Required
          in: path
          required: true
          type: string
      tags:
        - PackageService
  /v2/parties:
    get:
      summary: |-
        List the parties known by the participant.
        The list returned contains parties whose ledger access is facilitated by
        the participant and the ones maintained elsewhere.
      operationId: PartyManagementService_ListKnownParties
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ListKnownPartiesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: pageToken
          description: |-
            Pagination token to determine the specific page to fetch. Using the token guarantees that parties on a subsequent
            page are all lexically greater than the last party on a previous page. Server does not store intermediate results
            between calls chained by a series of page tokens. As a consequence, if new parties are being added and a page is
            requested twice using the same token, more parties can be returned on the second call.
            Leave empty to fetch the first page.

            Optional
          in: query
          required: false
          type: string
        - name: pageSize
          description: |-
            Maximum number of results to be returned by the server. The server will return no more than that many results,
            but it might return fewer. If the page_size is 0, the server will decide the number of results to be returned.
            If the page_size exceeds the maximum supported by the server, an error will be returned. To obtain the server's
            maximum consult the PartyManagementFeature descriptor available in the VersionService.

            Optional
          in: query
          required: false
          type: integer
          format: int32
        - name: identityProviderId
          description: |-
            The id of the ``Identity Provider`` whose parties should be retrieved.
            If not set, assume the party is managed by the default identity provider or party is not hosted by the participant.

            Optional
          in: query
          required: false
          type: string
        - name: filterParty
          description: |-
            An optional filter for the party name, searching for all party names known to this node
            starting with the given prefix. This can either be just a string or extend up to the full
            identifier.

            Optional
          in: query
          required: false
          type: string
      tags:
        - PartyManagementService
    post:
      summary: |-
        Allocates a new party on a ledger and adds it to the set managed by the participant.
        Caller specifies a party identifier suggestion, the actual identifier
        allocated might be different and is implementation specific.
        Caller can specify party metadata that is stored locally on the participant.
        This call may:
      description: |-
        - Succeed, in which case the actual allocated identifier is visible in
          the response.
        - Respond with a gRPC error

        daml-on-kv-ledger: suggestion's uniqueness is checked by the validators in
        the consensus layer and call rejected if the identifier is already present.
        canton: completely different globally unique identifier is allocated.
        Behind the scenes calls to an internal protocol are made. As that protocol
        is richer than the surface protocol, the arguments take implicit values
        The party identifier suggestion must be a valid party name. Party names are required to be non-empty US-ASCII strings built from letters, digits, space,
        colon, minus and underscore limited to 255 chars
      operationId: PartyManagementService_AllocateParty
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.AllocatePartyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.AllocatePartyRequest'
      tags:
        - PartyManagementService
  /v2/parties/external/allocate:
    post:
      summary: 'Alpha 3.3: Endpoint to allocate a new external party on a synchronizer'
      description: |-
        Expected to be stable in 3.5

        The external party must be hosted (at least) on this node with either confirmation or observation permissions
        It can optionally be hosted on other nodes (then called a multi-hosted party).
        If hosted on additional nodes, explicit authorization of the hosting relationship must be performed on those nodes
        before the party can be used.
        Decentralized namespaces are supported but must be provided fully authorized by their owners.
        The individual owner namespace transactions can be submitted in the same call (fully authorized as well).
        In the simple case of a non-multi hosted, non-decentralized party, the RPC will return once the party is
        effectively allocated and ready to use, similarly to the AllocateParty behavior.
        For more complex scenarios applications may need to query the party status explicitly (only through the admin API as of now).
      operationId: PartyManagementService_AllocateExternalParty
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.AllocateExternalPartyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.AllocateExternalPartyRequest'
      tags:
        - PartyManagementService
  /v2/parties/external/generate-topology:
    post:
      summary: 'Alpha 3.3: Convenience endpoint to generate topology transactions for external signing'
      description: |-
        Expected to be stable in 3.5

        You may use this endpoint to generate the common external topology transactions
        which can be signed externally and uploaded as part of the allocate party process

        Note that this request will create a normal namespace using the same key for the
        identity as for signing. More elaborate schemes such as multi-signature
        or decentralized parties require you to construct the topology transactions yourself.
      operationId: PartyManagementService_GenerateExternalPartyTopology
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GenerateExternalPartyTopologyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GenerateExternalPartyTopologyRequest'
      tags:
        - PartyManagementService
  /v2/parties/participant-id:
    get:
      summary: |-
        Return the identifier of the participant.
        All horizontally scaled replicas should return the same id.
        daml-on-kv-ledger: returns an identifier supplied on command line at launch time
        canton: returns globally unique identifier of the participant
      operationId: PartyManagementService_GetParticipantId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GetParticipantIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - PartyManagementService
  /v2/parties/{parties}:
    get:
      summary: |-
        Get the party details of the given parties. Only known parties will be
        returned in the list.
      operationId: PartyManagementService_GetParties
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GetPartiesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: parties
          description: |-
            The stable, unique identifier of the Daml parties.
            Must be valid PartyIdStrings (as described in ``value.proto``).

            Required: must be non-empty
          in: path
          required: true
          type: array
          items:
            type: string
          collectionFormat: csv
          minItems: 1
        - name: identityProviderId
          description: |-
            The id of the ``Identity Provider`` whose parties should be retrieved.
            If not set, assume the party is managed by the default identity provider or party is not hosted by the participant.

            Optional
          in: query
          required: false
          type: string
      tags:
        - PartyManagementService
  /v2/parties/{partyDetails.party}:
    patch:
      summary: |-
        Update selected modifiable participant-local attributes of a party details resource.
        Can update the participant's local information for local parties.
      operationId: PartyManagementService_UpdatePartyDetails
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdatePartyDetailsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: partyDetails.party
          description: |-
            The stable unique identifier of a Daml party.
            Must be a valid PartyIdString (as described in ``value.proto``).

            Required
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.PartyManagementService.UpdatePartyDetailsBody'
      tags:
        - PartyManagementService
  /v2/state/active-contracts:
    post:
      summary: |-
        Returns a stream of the snapshot of the active contracts and incomplete (un)assignments at a ledger offset.
        Once the stream of GetActiveContractsResponses completes,
        the client SHOULD begin streaming updates from the update service,
        starting at the GetActiveContractsRequest.active_at_offset specified in this request.
        Clients SHOULD NOT assume that the set of active contracts they receive reflects the state at the ledger end.
      operationId: StateService_GetActiveContracts
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/com.daml.ledger.api.v2.GetActiveContractsResponse'
              error:
                $ref: '#/definitions/google.rpc.Status'
            title: Stream result of com.daml.ledger.api.v2.GetActiveContractsResponse
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          description: |-
            If the given offset is different than the ledger end, and there are (un)assignments in-flight at the given offset,
            the snapshot may fail with "FAILED_PRECONDITION/PARTICIPANT_PRUNED_DATA_ACCESSED".
            Note that it is ok to request acs snapshots for party migration with offsets other than ledger end, because party
            migration is not concerned with incomplete (un)assignments.
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetActiveContractsRequest'
      tags:
        - StateService
  /v2/state/active-contracts-page:
    post:
      summary: |-
        Returns a page of the snapshot of the active contracts and incomplete (un)assignments at a ledger offset.
        Once all pages are fetched by repeated calls to ``GetActiveContractsPage``,
        the client SHOULD begin retrieving updates from the update service,
        starting at the ``GetActiveContractsPageResponse``.``active_at_offset`` specified in this request.
        Clients SHOULD NOT assume that the set of active contracts they receive reflects the state at the ledger end.
      operationId: StateService_GetActiveContractsPage
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetActiveContractsPageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetActiveContractsPageRequest'
      tags:
        - StateService
  /v2/state/connected-synchronizers:
    get:
      summary: Get the list of connected synchronizers at the time of the query.
      operationId: StateService_GetConnectedSynchronizers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetConnectedSynchronizersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: party
          description: |-
            The party of interest
            Must be a valid PartyIdString (as described in ``value.proto``).
            If empty, all synchronizers this node is connected to will be returned

            Optional
          in: query
          required: false
          type: string
        - name: participantId
          description: |-
            The id of a participant whose mapping of a party to connected synchronizers is requested.
            Must be a valid participant-id retrieved through a prior call to getParticipantId.
            Defaults to the participant id of the host participant.

            Optional
          in: query
          required: false
          type: string
        - name: identityProviderId
          description: |-
            The ID of the identity provider configured by ``Identity Provider Config``
            If not set, it's assumed the user is managed by the default identity provider.

            Optional
          in: query
          required: false
          type: string
      tags:
        - StateService
  /v2/state/latest-pruned-offsets:
    get:
      summary: Get the latest successfully pruned ledger offsets
      operationId: StateService_GetLatestPrunedOffsets
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetLatestPrunedOffsetsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - StateService
  /v2/state/ledger-end:
    get:
      summary: |-
        Get the current ledger end.
        Subscriptions started with the returned offset will serve events after this RPC was called.
      operationId: StateService_GetLedgerEnd
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetLedgerEndResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      tags:
        - StateService
  /v2/updates:
    post:
      summary: |-
        Read the ledger's filtered update stream for the specified contents and filters.
        It returns the event types in accordance with the stream contents selected. Also the selection criteria
        for individual events depends on the transaction shape chosen.
      description: |-
        - ACS delta: a requesting party must be a stakeholder of an event for it to be included.
        - ledger effects: a requesting party must be a witness of an event for it to be included.
      operationId: UpdateService_GetUpdates
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdatesResponse'
              error:
                $ref: '#/definitions/google.rpc.Status'
            title: Stream result of com.daml.ledger.api.v2.GetUpdatesResponse
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          description: |-
            Exclusive lower bound offset of the requested ledger section (non-negative integer).
             The response will only contain transactions whose offset is strictly greater than this.
             If set to zero, the lower bound is set to the beginning of the ledger.
             If the participant has been pruned, this parameter must be greater or equal than the pruning offset.
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdatesRequest'
      tags:
        - UpdateService
  /v2/updates/get-updates-page:
    post:
      summary: |-
        Read a page of ledger's filtered updates. It returns the event types in accordance with
        the specified contents and filters.
        Additionally, the selection criteria for individual events depends on the transaction shape chosen.
      description: |-
        - ACS delta: an event is included only if the requesting party is a stakeholder.
        - ledger effects: an event is included if the requesting party is a witness.
      operationId: UpdateService_GetUpdatesPage
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdatesPageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdatesPageRequest'
      tags:
        - UpdateService
  /v2/updates/update-by-id:
    post:
      summary: |-
        Lookup an update by its ID.
        If there is no update with this ID, or all the events are filtered, an UPDATE_NOT_FOUND error will be raised.
      operationId: UpdateService_GetUpdateById
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdateByIdRequest'
      tags:
        - UpdateService
  /v2/updates/update-by-offset:
    post:
      summary: |-
        Lookup an update by its offset.
        If there is no update with this offset, or all the events are filtered, an UPDATE_NOT_FOUND error will be raised.
      operationId: UpdateService_GetUpdateByOffset
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdateResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.GetUpdateByOffsetRequest'
      tags:
        - UpdateService
  /v2/users:
    get:
      summary: List all existing users.
      operationId: UserManagementService_ListUsers
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ListUsersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: pageToken
          description: |-
            Pagination token to determine the specific page to fetch.
            Leave empty to fetch the first page.

            Optional
          in: query
          required: false
          type: string
        - name: pageSize
          description: |-
            Maximum number of results to be returned by the server. The server will return no more than that many results, but it might return fewer.
            If 0, the server will decide the number of results to be returned.

            Optional
          in: query
          required: false
          type: integer
          format: int32
        - name: identityProviderId
          description: |-
            The id of the ``Identity Provider``
            If not set, assume the user is managed by the default identity provider.

            Optional
          in: query
          required: false
          type: string
      tags:
        - UserManagementService
    post:
      summary: Create a new user.
      operationId: UserManagementService_CreateUser
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.CreateUserResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.CreateUserRequest'
      tags:
        - UserManagementService
  /v2/users/{user.id}:
