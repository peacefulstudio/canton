    description: |-
      The rights of a participant's super reader. Its utility is predominantly for
      feeding external tools, such as PQS, continually without the need to change subscriptions
      as new parties pop in and out of existence.
  com.daml.ledger.api.v2.admin.Right.IdentityProviderAdmin:
    type: object
    description: |-
      The right to administer the identity provider that the user is assigned to.
      It means, being able to manage users and parties that are also assigned
      to the same identity provider.
  com.daml.ledger.api.v2.admin.Right.ParticipantAdmin:
    type: object
    description: The right to administer the participant node.
  com.daml.ledger.api.v2.admin.UpdateIdentityProviderConfigResponse:
    type: object
    properties:
      identityProviderConfig:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.IdentityProviderConfig'
        description: Required
        title: Updated identity provider config
  com.daml.ledger.api.v2.admin.UpdatePartyDetailsResponse:
    type: object
    properties:
      partyDetails:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.PartyDetails'
        description: Required
        title: Updated party details
  com.daml.ledger.api.v2.admin.UpdateUserIdentityProviderIdResponse:
    type: object
  com.daml.ledger.api.v2.admin.UpdateUserResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.User'
        description: Required
        title: Updated user
  com.daml.ledger.api.v2.admin.UpdateVettedPackagesForceFlag:
    type: string
    enum:
      - UPDATE_VETTED_PACKAGES_FORCE_FLAG_UNSPECIFIED
      - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_VET_INCOMPATIBLE_UPGRADES
      - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_UNVETTED_DEPENDENCIES
    default: UPDATE_VETTED_PACKAGES_FORCE_FLAG_UNSPECIFIED
    title: |-
      - UPDATE_VETTED_PACKAGES_FORCE_FLAG_UNSPECIFIED: Force flag left unspecified, defaults to no force flag used in the backend.
       - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_VET_INCOMPATIBLE_UPGRADES: * Allow vetting a package that is upgrade-incompatible with other vetted packages
       - UPDATE_VETTED_PACKAGES_FORCE_FLAG_ALLOW_UNVETTED_DEPENDENCIES: * Allow vetting a package without vetting one or more of its dependencies
  com.daml.ledger.api.v2.admin.UpdateVettedPackagesRequest:
    type: object
    properties:
      changes:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.VettedPackagesChange'
        description: |-
          Changes to apply to the current vetting state of the participant on the
          specified synchronizer. The changes are applied in order.
          Any package not changed will keep their previous vetting state.

          Required: must be non-empty
      dryRun:
        type: boolean
        description: |-
          If dry_run is true, then the changes are only prepared, but not applied. If
          a request would trigger an error when run (e.g. TOPOLOGY_DEPENDENCIES_NOT_VETTED),
          it will also trigger an error when dry_run.

          Use this flag to preview a change before applying it.
          Defaults to false.

          Optional
      synchronizerId:
        type: string
        description: |-
          If set, the requested changes will take place on the specified
          synchronizer. If synchronizer_id is unset and the participant is only
          connected to a single synchronizer, that synchronizer will be used by
          default. If synchronizer_id is unset and the participant is connected to
          multiple synchronizers, the request will error out with
          PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

          Optional
      expectedTopologySerial:
        $ref: '#/definitions/com.daml.ledger.api.v2.PriorTopologySerial'
        description: |-
          The serial of the last ``VettedPackages`` topology transaction of this
          participant and on this synchronizer.

          Execution of the request fails if this is not correct. Use this to guard
          against concurrent changes.

          If left unspecified, no validation is done against the last transaction's
          serial.

          Optional
      updateVettedPackagesForceFlags:
        type: array
        items:
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdateVettedPackagesForceFlag'
        description: |-
          Controls whether potentially unsafe vetting updates are allowed.

          Optional: can be empty
  com.daml.ledger.api.v2.admin.UpdateVettedPackagesResponse:
    type: object
    properties:
      pastVettedPackages:
        $ref: '#/definitions/com.daml.ledger.api.v2.VettedPackages'
        description: |-
          All vetted packages on this participant and synchronizer, before the
          specified changes. Empty if no vetting state existed beforehand.

          Not populated if no vetted topology state exists prior to the update.

          Optional
      newVettedPackages:
        $ref: '#/definitions/com.daml.ledger.api.v2.VettedPackages'
        description: |-
          All vetted packages on this participant and synchronizer, after the specified changes.

          Required
  com.daml.ledger.api.v2.admin.UploadDarFileRequest:
    type: object
    properties:
      darFile:
        type: string
        format: byte
        description: |-
          Contains a Daml archive DAR file, which in turn is a jar like zipped
          container for ``daml_lf`` archives. See further details in
          ``daml_lf.proto``.

          Required: must be non-empty
      submissionId:
        type: string
        description: |-
          Unique submission identifier.
          If not populated, a random identifier will be generated.

          Optional
      vettingChange:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.UploadDarFileRequest.VettingChange'
        description: Optional
        title: How to vet packages in the DAR being uploaded
      synchronizerId:
        type: string
        description: |-
          Only used if VettingChange is set to VETTING_CHANGE_VET_ALL_PACKAGES, in
          order to specify which synchronizer to vet on.

          If synchronizer_id is set, the synchronizer with this ID will be used. If
          synchronizer_id is unset and the participant is only connected to a single
          synchronizer, that synchronizer will be used by default. If synchronizer_id
          is unset and the participant is connected to multiple synchronizers, the
          request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

          Optional
  com.daml.ledger.api.v2.admin.UploadDarFileRequest.VettingChange:
    type: string
    enum:
      - VETTING_CHANGE_UNSPECIFIED
      - VETTING_CHANGE_VET_ALL_PACKAGES
      - VETTING_CHANGE_DONT_VET_ANY_PACKAGES
    default: VETTING_CHANGE_UNSPECIFIED
    description: |2-
       - VETTING_CHANGE_UNSPECIFIED: Vetting change field left unspecified, defaults to vetting all the
      packages in the DAR.
       - VETTING_CHANGE_VET_ALL_PACKAGES: Vet all the packages in the DAR.
       - VETTING_CHANGE_DONT_VET_ANY_PACKAGES: Do not vet any packages in the DAR.
  com.daml.ledger.api.v2.admin.UploadDarFileResponse:
    type: object
    description: A message that is received when the upload operation succeeded.
  com.daml.ledger.api.v2.admin.User:
    type: object
    properties:
      id:
        type: string
        description: |-
          The user identifier, which must be a non-empty string of at most 128
          characters that are either alphanumeric ASCII characters or one of the symbols "@^$.!`-#+'~_|:()".

          Required
      primaryParty:
        type: string
        description: Optional
        title: |-
          The primary party as which this user reads and acts by default on the ledger
          *provided* it has the corresponding ``CanReadAs(primary_party)`` or
          ``CanActAs(primary_party)`` rights.
          Ledger API clients SHOULD set this field to a non-empty value for all users to
          enable the users to act on the ledger using their own Daml party.
          Users for participant administrators MAY have an associated primary party.
          Modifiable
      isDeactivated:
        type: boolean
        description: Optional
        title: |-
          When set, then the user is denied all access to the Ledger API.
          Otherwise, the user has access to the Ledger API as per the user's rights.
          Modifiable
      metadata:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.ObjectMeta'
        description: Optional
        title: |-
          The metadata of this user.
          Note that the ``metadata.resource_version`` tracks changes to the properties described by the ``User`` message and not the user's rights.
          Modifiable
      identityProviderId:
        type: string
        description: |-
          The ID of the identity provider configured by ``Identity Provider Config``
          If not set, assume the user is managed by the default identity provider.

          Optional
      primaryPartyAuthentication:
        type: boolean
        description: Optional
        title: |-
          If set to true, the user may authenticate against the Ledger API by signing
          a Party JWT using the primary party's signing key.
          Modifiable
    description: |-
      Users are used to dynamically manage the rights given to Daml applications.
      They are stored and managed per participant node.
  com.daml.ledger.api.v2.admin.UserManagementService.GrantUserRightsBody:
    type: object
    properties:
      rights:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.Right'
        description: |-
          The rights to grant.

          Optional: can be empty
      identityProviderId:
        type: string
        description: |-
          The id of the ``Identity Provider``
          If not set, assume the user is managed by the default identity provider.

          Optional
    description: |-
      Add the rights to the set of rights granted to the user.

      Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(identity_provider_id)``
  com.daml.ledger.api.v2.admin.UserManagementService.RevokeUserRightsBody:
    type: object
    properties:
      rights:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.Right'
        description: |-
          The rights to revoke.

          Optional: can be empty
      identityProviderId:
        type: string
        description: |-
          The id of the ``Identity Provider``
          If not set, assume the user is managed by the default identity provider.

          Optional
    description: |-
      Remove the rights from the set of rights granted to the user.

      Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(identity_provider_id)``
  com.daml.ledger.api.v2.admin.UserManagementService.UpdateUserBody:
    type: object
    properties:
      user:
        type: object
        properties:
          primaryParty:
            type: string
            description: Optional
            title: |-
              The primary party as which this user reads and acts by default on the ledger
              *provided* it has the corresponding ``CanReadAs(primary_party)`` or
              ``CanActAs(primary_party)`` rights.
              Ledger API clients SHOULD set this field to a non-empty value for all users to
              enable the users to act on the ledger using their own Daml party.
              Users for participant administrators MAY have an associated primary party.
              Modifiable
          isDeactivated:
            type: boolean
            description: Optional
            title: |-
              When set, then the user is denied all access to the Ledger API.
              Otherwise, the user has access to the Ledger API as per the user's rights.
              Modifiable
          metadata:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ObjectMeta'
            description: Optional
            title: |-
              The metadata of this user.
              Note that the ``metadata.resource_version`` tracks changes to the properties described by the ``User`` message and not the user's rights.
              Modifiable
          identityProviderId:
            type: string
            description: |-
              The ID of the identity provider configured by ``Identity Provider Config``
              If not set, assume the user is managed by the default identity provider.

              Optional
          primaryPartyAuthentication:
            type: boolean
            description: Optional
            title: |-
              If set to true, the user may authenticate against the Ledger API by signing
              a Party JWT using the primary party's signing key.
              Modifiable
        description: |-
          The user to update.
          Modifiable

          Required
        title: |-
          The user to update.
          Modifiable
      updateMask:
        type: string
        description: |-
          1. contain at least one update path,
          2. contain only valid update paths.

          Fields that can be updated are marked as ``Modifiable``.
          An update path can also point to a non-``Modifiable`` fields such as 'id' and 'metadata.resource_version'
          because they are used:

          1. to identify the user resource subject to the update,
          2. for concurrent change control.

          Examples of valid update paths: 'primary_party', 'metadata', 'metadata.annotations'.
          For additional information see the documentation for standard protobuf3's ``google.protobuf.FieldMask``.
          For similar Ledger API see ``com.daml.ledger.api.v2.admin.UpdatePartyDetailsRequest``.

          Required
        title: |-
          An update mask specifies how and which properties of the ``User`` message are to be updated.
          An update mask consists of a set of update paths.
          A valid update path points to a field or a subfield relative to the ``User`` message.
          A valid update mask must:
    title: 'Required authorization: ``HasRight(ParticipantAdmin) OR IsAuthenticatedIdentityProviderAdmin(user.identity_provider_id)``'
  com.daml.ledger.api.v2.admin.UserManagementService.UpdateUserIdentityProviderIdBody:
    type: object
    properties:
      sourceIdentityProviderId:
        type: string
        description: Optional
        title: |-
          Current identity provider ID of the user
          If omitted, the default IDP is assumed
      targetIdentityProviderId:
        type: string
        description: Optional
        title: |-
          Target identity provider ID of the user
          If omitted, the default IDP is assumed
    title: 'Required authorization: ``HasRight(ParticipantAdmin)``'
  com.daml.ledger.api.v2.admin.ValidateDarFileRequest:
    type: object
    properties:
      darFile:
        type: string
        format: byte
        description: |-
          Contains a Daml archive DAR file, which in turn is a jar like zipped
          container for ``daml_lf`` archives. See further details in
          ``daml_lf.proto``.

          Required: must be non-empty
      submissionId:
        type: string
        description: |-
          Unique submission identifier. If not defined, defaults to a random identifier.

          Optional
      synchronizerId:
        type: string
        description: |-
          If synchronizer_id is set, the synchronizer with this ID will be used. If
          synchronizer_id is unset and the participant is only connected to a single
          synchronizer, that synchronizer will be used by default. If synchronizer_id
          is unset and the participant is connected to multiple synchronizers, the
          request will error out with PACKAGE_SERVICE_CANNOT_AUTODETECT_SYNCHRONIZER.

          Optional
    description: |-
      Performs the same checks that UploadDarFileRequest would perform, but doesn't
      upload the DAR.
  com.daml.ledger.api.v2.admin.ValidateDarFileResponse:
    type: object
  com.daml.ledger.api.v2.admin.VettedPackagesChange:
    type: object
    properties:
      vet:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.VettedPackagesChange.Vet'
        description: Add packages to or update packages in the set of vetted packages.
      unvet:
        $ref: '#/definitions/com.daml.ledger.api.v2.admin.VettedPackagesChange.Unvet'
        description: Remove packages from the set of vetted packages.
    description: A change to the set of vetted packages.
  com.daml.ledger.api.v2.admin.VettedPackagesChange.Unvet:
    type: object
    properties:
      packages:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.VettedPackagesRef'
        description: |-
          Packages to be unvetted.

          If a reference in this list matches multiple packages, they are all
          unvetted.

          Required: must be non-empty
    title: Remove packages from the set of vetted packages
  com.daml.ledger.api.v2.admin.VettedPackagesChange.Vet:
    type: object
    properties:
      packages:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.admin.VettedPackagesRef'
        description: |-
          Packages to be vetted.

          If a reference in this list matches more than one package, the change is
          considered ambiguous and the entire update request is rejected. In other
          words, every reference must match exactly one package.

          Required: must be non-empty
      newValidFromInclusive:
        type: string
        format: date-time
        title: |-
          The time from which these packages should be vetted, prior lower bounds
          are overwritten.
          Optional
      newValidUntilExclusive:
        type: string
        format: date-time
        title: |-
          The time until which these packages should be vetted, prior upper bounds
          are overwritten.
          Optional
    description: |-
      Set vetting bounds of a list of packages. Packages that were not previously
      vetted have their bounds added, previous vetting bounds are overwritten.
  com.daml.ledger.api.v2.admin.VettedPackagesRef:
    type: object
    properties:
      packageId:
        type: string
        description: |-
          Package's package id must be the same as this field.

          Optional
      packageName:
        type: string
        description: |-
          Package's name must be the same as this field.

          Optional
      packageVersion:
        type: string
        description: |-
          Package's version must be the same as this field.

          Optional
    description: |-
      A reference to identify one or more packages.

      A reference matches a package if its ``package_id`` matches the package's ID,
      its ``package_name`` matches the package's name, and its ``package_version``
      matches the package's version. If an attribute in the reference is left
      unspecified (i.e. as an empty string), that attribute is treated as a
      wildcard. At a minimum, ``package_id`` or the ``package_name`` must be
      specified.

      If a reference does not match any package, the reference is considered
      unresolved and the entire update request is rejected.
  com.daml.ledger.api.v2.interactive.CostEstimation:
    type: object
    properties:
      estimationTimestamp:
        type: string
        format: date-time
        description: Required
        title: Timestamp at which the estimation was made
      confirmationRequestTrafficCostEstimation:
        type: string
        format: uint64
        description: Required
        title: Estimated traffic cost of the confirmation request associated with the transaction
      confirmationResponseTrafficCostEstimation:
        type: string
        format: uint64
        description: Required
        title: |-
          Estimated traffic cost of the confirmation response associated with the transaction
          This field can also be used as an indication of the cost that other potential confirming nodes
          of the party will incur to approve or reject the transaction
      totalTrafficCostEstimation:
        type: string
        format: uint64
        description: Required
        title: Sum of the fields above
    description: |-
      Estimation of the cost of submitting the prepared transaction
      The estimation is done against the synchronizer chosen during preparation of the transaction
      (or the one explicitly requested).
      The cost of re-assigning contracts to another synchronizer when necessary is not included in the estimation.
  com.daml.ledger.api.v2.interactive.CostEstimationHints:
    type: object
    properties:
      disabled:
        type: boolean
        description: Optional
        title: |-
          Disable cost estimation
          Default (not set) is false
      expectedSignatures:
        type: array
        items:
          $ref: '#/definitions/com.daml.ledger.api.v2.SigningAlgorithmSpec'
        description: 'Optional: can be empty'
        title: |-
          Details on the keys that will be used to sign the transaction (how many and of which type).
          Signature size impacts the cost of the transaction.
          If empty, the signature sizes will be approximated with threshold-many signatures (where threshold is defined
          in the PartyToParticipant of the external party), using keys in the order they are registered.
          Empty list is equivalent to not providing this field
    title: Hints to improve cost estimation precision of a prepared transaction
  com.daml.ledger.api.v2.interactive.DamlTransaction:
    type: object
    properties:
      version:
        type: string
        description: Required
        title: serialization version, will be >= max(nodes version)
      roots:
        type: array
        items:
          type: string
        description: 'Required: must be non-empty'
        title: Root nodes of the transaction
      nodes:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.interactive.DamlTransaction.Node'
        description: 'Required: must be non-empty'
        title: List of nodes in the transaction
      nodeSeeds:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.interactive.DamlTransaction.NodeSeed'
        description: 'Required: must be non-empty'
        title: Node seeds are values associated with certain nodes used for generating cryptographic salts
    description: |-
      Daml Transaction.
      This represents the effect on the ledger if this transaction is successfully committed.
  com.daml.ledger.api.v2.interactive.DamlTransaction.Node:
    type: object
    properties:
      nodeId:
        type: string
        title: Required
      v1:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.transaction.v1.Node'
        description: Required
        title: |-
          Start at 1000 so we can add more fields before if necessary
          When new versions will be added, they will show here
    title: |-
      A transaction may contain nodes with different versions.
      Each node must be hashed using the hashing algorithm corresponding to its specific version.
      [docs-entry-start: DamlTransaction.Node]
  com.daml.ledger.api.v2.interactive.DamlTransaction.NodeSeed:
    type: object
    properties:
      nodeId:
        type: integer
        format: int32
        title: Required
      seed:
        type: string
        format: byte
        title: 'Required: must be non-empty'
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitForTransactionRequest:
    type: object
    properties:
      preparedTransaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PreparedTransaction'
        description: |-
          the prepared transaction
          Typically this is the value of the `prepared_transaction` field in `PrepareSubmissionResponse`
          obtained from calling `prepareSubmission`.

          Required
      partySignatures:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PartySignatures'
        description: |-
          The party(ies) signatures that authorize the prepared submission to be executed by this node.
          Each party can provide one or more signatures..
          and one or more parties can sign.
          Note that currently, only single party submissions are supported.

          Required
      deduplicationDuration:
        type: string
        description: |-
          Specifies the length of the deduplication period.
          It is interpreted relative to the local clock at some point during the submission's processing.
          Must be non-negative. Must not exceed the maximum deduplication time.
      deduplicationOffset:
        type: string
        format: int64
        description: |-
          Specifies the start of the deduplication period by a completion stream offset (exclusive).
          Must be a valid absolute offset (positive integer).
      submissionId:
        type: string
        description: |-
          A unique identifier to distinguish completions for different submissions with the same change ID.
          Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
          with the same change ID.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      userId:
        type: string
        description: Optional
        title: See [PrepareSubmissionRequest.user_id]
      hashingSchemeVersion:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.HashingSchemeVersion'
        description: Required
        title: The hashing scheme version used when building the hash
      minLedgerTime:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.MinLedgerTime'
        description: |-
          If set will influence the chosen ledger effective time but will not result in a submission delay so any override
          should be scheduled to executed within the window allowed by synchronizer.

          Optional
      transactionFormat:
        $ref: '#/definitions/com.daml.ledger.api.v2.TransactionFormat'
        description: |-
          If no ``transaction_format`` is provided, a default will be used where ``transaction_shape`` is set to
          TRANSACTION_SHAPE_ACS_DELTA, ``event_format`` is defined with ``filters_by_party`` containing wildcard-template
          filter for all original ``act_as`` and ``read_as`` parties and the ``verbose`` flag is set.
          When the ``transaction_shape`` TRANSACTION_SHAPE_ACS_DELTA shape is used (explicitly or is defaulted to as explained above),
          events will only be returned if the submitting party is hosted on this node.

          Optional
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitForTransactionResponse:
    type: object
    properties:
      transaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.Transaction'
        description: |-
          The transaction that resulted from the submitted command.
          The transaction might contain no events (request conditions result in filtering out all of them).

          Required
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitRequest:
    type: object
    properties:
      preparedTransaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PreparedTransaction'
        description: |-
          the prepared transaction
          Typically this is the value of the `prepared_transaction` field in `PrepareSubmissionResponse`
          obtained from calling `prepareSubmission`.

          Required
      partySignatures:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PartySignatures'
        description: |-
          The party(ies) signatures that authorize the prepared submission to be executed by this node.
          Each party can provide one or more signatures..
          and one or more parties can sign.
          Note that currently, only single party submissions are supported.

          Required
      deduplicationDuration:
        type: string
        description: |-
          Specifies the length of the deduplication period.
          It is interpreted relative to the local clock at some point during the submission's processing.
          Must be non-negative. Must not exceed the maximum deduplication time.
      deduplicationOffset:
        type: string
        format: int64
        description: |-
          Specifies the start of the deduplication period by a completion stream offset (exclusive).
          Must be a valid absolute offset (positive integer).
      submissionId:
        type: string
        description: |-
          A unique identifier to distinguish completions for different submissions with the same change ID.
          Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
          with the same change ID.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      userId:
        type: string
        description: Optional
        title: See [PrepareSubmissionRequest.user_id]
      hashingSchemeVersion:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.HashingSchemeVersion'
        description: Required
        title: The hashing scheme version used when building the hash
      minLedgerTime:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.MinLedgerTime'
        description: |-
          If set will influence the chosen ledger effective time but will not result in a submission delay so any override
          should be scheduled to executed within the window allowed by synchronizer.

          Optional
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionAndWaitResponse:
    type: object
    properties:
      updateId:
        type: string
        description: |-
          The id of the transaction that resulted from the submitted command.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      completionOffset:
        type: string
        format: int64
        description: |-
          The details of the offset field are described in ``community/ledger-api/README.md``.

          Required
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionRequest:
    type: object
    properties:
      preparedTransaction:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PreparedTransaction'
        description: |-
          the prepared transaction
          Typically this is the value of the `prepared_transaction` field in `PrepareSubmissionResponse`
          obtained from calling `prepareSubmission`.

          Required
      partySignatures:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PartySignatures'
        description: |-
          The party(ies) signatures that authorize the prepared submission to be executed by this node.
          Each party can provide one or more signatures..
          and one or more parties can sign.
          Note that currently, only single party submissions are supported.

          Required
      deduplicationDuration:
        type: string
        description: |-
          Specifies the length of the deduplication period.
          It is interpreted relative to the local clock at some point during the submission's processing.
          Must be non-negative. Must not exceed the maximum deduplication time.
      deduplicationOffset:
        type: string
        format: int64
        description: |-
          Specifies the start of the deduplication period by a completion stream offset (exclusive).
          Must be a valid absolute offset (positive integer).
      submissionId:
        type: string
        description: |-
          A unique identifier to distinguish completions for different submissions with the same change ID.
          Typically a random UUID. Applications are expected to use a different UUID for each retry of a submission
          with the same change ID.
          Must be a valid LedgerString (as described in ``value.proto``).

          Required
      userId:
        type: string
        description: Optional
        title: See [PrepareSubmissionRequest.user_id]
      hashingSchemeVersion:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.HashingSchemeVersion'
        description: Required
        title: The hashing scheme version used when building the hash
      minLedgerTime:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.MinLedgerTime'
        description: |-
          If set will influence the chosen ledger effective time but will not result in a submission delay so any override
          should be scheduled to executed within the window allowed by synchronizer.

          Optional
  com.daml.ledger.api.v2.interactive.ExecuteSubmissionResponse:
    type: object
  com.daml.ledger.api.v2.interactive.GetPreferredPackageVersionResponse:
    type: object
    properties:
      packagePreference:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PackagePreference'
        description: Optional
        title: Not populated when no preferred package is found
  com.daml.ledger.api.v2.interactive.GetPreferredPackagesRequest:
    type: object
    properties:
      packageVettingRequirements:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.interactive.PackageVettingRequirement'
        description: |-
          The package-name vetting requirements for which the preferred packages should be resolved.

          Generally it is enough to provide the requirements for the intended command's root package-names.
          Additional package-name requirements can be provided when additional Daml transaction informees need to use
          package dependencies of the command's root packages.

          Required: must be non-empty
      synchronizerId:
        type: string
        description: |-
          The synchronizer whose vetting state should be used for resolving this query.
          If not specified, the vetting states of all synchronizers to which the participant is connected are used.

          Optional
      vettingValidAt:
        type: string
        format: date-time
        description: |-
          The timestamp at which the package vetting validity should be computed
          on the latest topology snapshot as seen by the participant.
          If not provided, the participant's current clock time is used.

          Optional
  com.daml.ledger.api.v2.interactive.GetPreferredPackagesResponse:
    type: object
    properties:
      packageReferences:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.PackageReference'
        description: |-
          The package references of the preferred packages.
          Must contain one package reference for each requested package-name.

          If you build command submissions whose content depends on the returned
          preferred packages, then we recommend submitting the preferred package-ids
          in the ``package_id_selection_preference`` of the command submission to
          avoid race conditions with concurrent changes of the on-ledger package vetting state.

          Required: must be non-empty
      synchronizerId:
        type: string
        description: |-
          The synchronizer for which the package preferences are computed.
          If the synchronizer_id was specified in the request, then it matches the request synchronizer_id.

          Required
  com.daml.ledger.api.v2.interactive.GlobalKey:
    type: object
    properties:
      templateId:
        $ref: '#/definitions/com.daml.ledger.api.v2.Identifier'
        description: |-
          The identifier uses the package-id reference format.

          Required
      packageName:
        type: string
        title: Required
      key:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: Required
      hash:
        type: string
        format: byte
        title: 'Required: must be non-empty'
  com.daml.ledger.api.v2.interactive.HashingSchemeVersion:
    type: string
    enum:
      - HASHING_SCHEME_VERSION_UNSPECIFIED
      - HASHING_SCHEME_VERSION_V2
      - HASHING_SCHEME_VERSION_V3
    default: HASHING_SCHEME_VERSION_UNSPECIFIED
    title: |-
      [docs-entry-start: HashingSchemeVersion]
      The hashing scheme version used when building the hash of the PreparedTransaction
  com.daml.ledger.api.v2.interactive.Metadata:
    type: object
    properties:
      submitterInfo:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.Metadata.SubmitterInfo'
        title: Required
      synchronizerId:
        type: string
        title: Required
      mediatorGroup:
        type: integer
        format: int64
        title: Required
      transactionUuid:
        type: string
        title: Required
      preparationTime:
        type: string
        format: uint64
        title: Required
      inputContracts:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.interactive.Metadata.InputContract'
        description: 'Optional: can be empty'
        title: Not populated if the transaction has no input contracts
      minLedgerEffectiveTime:
        type: string
        format: uint64
        title: Optional
      maxLedgerEffectiveTime:
        type: string
        format: uint64
        title: Optional
      globalKeyMapping:
        type: array
        items:
          type: object
          $ref: '#/definitions/com.daml.ledger.api.v2.interactive.Metadata.GlobalKeyMappingEntry'
        description: 'Optional: can be empty'
        title: |-
          Contextual information needed to process the transaction but not signed, either because it's already indirectly
          signed by signing the transaction, or because it doesn't impact the ledger state
      maxRecordTime:
        type: string
        format: uint64
        description: Optional
        title: |-
          Maximum timestamp at which the transaction can be recorded onto the ledger via the synchronizer `synchronizer_id`.
          If submitted after it will be rejected even if otherwise valid, in which case it needs to be prepared and signed again
          with a new valid max_record_time.
          Unsigned in 3.3 to avoid a breaking protocol change
          Will be signed in 3.4+
          Set max_record_time in the PreparedTransactionRequest to get this field set accordingly
    description: |-
      Transaction Metadata
      Refer to the hashing documentation for information on how it should be hashed.
  com.daml.ledger.api.v2.interactive.Metadata.GlobalKeyMappingEntry:
    type: object
    properties:
      key:
        $ref: '#/definitions/com.daml.ledger.api.v2.interactive.GlobalKey'
        title: Required
      value:
        $ref: '#/definitions/com.daml.ledger.api.v2.Value'
        title: Optional
  com.daml.ledger.api.v2.interactive.Metadata.InputContract:
    type: object
