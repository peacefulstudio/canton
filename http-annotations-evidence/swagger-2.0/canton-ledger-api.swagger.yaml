            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: userId
          description: |-
            The user to delete.

            Required
          in: path
          required: true
          type: string
        - name: identityProviderId
          description: |-
            The id of the ``Identity Provider``
            If not set, assume the user is managed by the default identity provider.

            Optional
          in: query
          required: false
          type: string
      tags:
        - UserManagementService
  /v2/users/{userId}/identity-provider-id:
    patch:
      summary: Update the assignment of a user from one IDP to another.
      operationId: UserManagementService_UpdateUserIdentityProviderId
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UpdateUserIdentityProviderIdResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: userId
          description: |-
            User to update

            Required
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.UserManagementService.UpdateUserIdentityProviderIdBody'
      tags:
        - UserManagementService
  /v2/users/{userId}/rights:
    get:
      summary: List the set of all rights granted to a user.
      operationId: UserManagementService_ListUserRights
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.ListUserRightsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/google.rpc.Status'
      parameters:
        - name: userId
          description: |-
            The user for which to list the rights.
            If set to empty string (the default), then the rights for the authenticated user will be listed.

            Required
          in: path
          required: true
          type: string
        - name: identityProviderId
          description: |-
            The id of the ``Identity Provider``
            If not set, assume the user is managed by the default identity provider.

            Optional
          in: query
          required: false
          type: string
      tags:
        - UserManagementService
    post:
      summary: |-
        Grant rights to a user.
        Granting rights does not affect the resource version of the corresponding user.
      operationId: UserManagementService_GrantUserRights
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/com.daml.ledger.api.v2.admin.GrantUserRightsResponse'
