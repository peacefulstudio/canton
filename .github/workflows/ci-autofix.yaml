# SECURITY: workflow_run executes in the default branch's context with
# secrets, but the checked-out tree is the PR's. Only enable in repos
# where every account with push access is fully trusted. Loop-prevention
# and cross-repo refusal live in the reusable workflow at
# peacefulstudio/github-actions/.github/workflows/ci-autofix.yaml.
name: Auto Fix CI Failures

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    uses: peacefulstudio/github-actions/.github/workflows/ci-autofix.yaml@v1
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      base_ref: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
    secrets: inherit
